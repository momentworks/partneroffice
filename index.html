<style>
html,body{margin:0;padding:0;background:#F7F5F0;}
/* ================= 파트너 포털 (통합관리시스템 내장 + 파트너스오피스 공용) ================= */
.pp{--pp-ink:#241F22;--pp-soft:#5B5650;--pp-paper:#EEF0EA;--pp-card:#FAFAF6;--pp-line:#D9D6C9;--pp-wine:#7A2E3A;--pp-wine-d:#5C1F29;--pp-gold:#A9823C;--pp-gold-s:#EFE3C6;--pp-sage:#4F6F52;--pp-sage-s:#E1EAE0;--pp-coral:#C1553D;--pp-coral-s:#F5DFD8;--pp-slate:#6B7280;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--pp-ink);background:var(--pp-paper);min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:40px;}
.pp *{box-sizing:border-box;}
.pp button{font-family:inherit;}
.pp-preview{background:var(--pp-gold);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;display:flex;justify-content:center;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
.pp-preview button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:12px;}
.pp-top>div:first-child{min-width:0;}
.pp-top{background:linear-gradient(135deg,var(--pp-wine-d),var(--pp-wine) 70%);color:#F5EFE6;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}
.pp-top-inner{max-width:640px;margin:0 auto;}
.pp-brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:11.5px;letter-spacing:.16em;white-space:nowrap;color:var(--pp-gold-s);text-transform:uppercase;}
.pp-who{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px;}
.pp-dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.55);}
.pp-role{font-family:'Pretendard';font-size:11px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 9px;}
.pp-top-actions{display:flex;gap:6px;}
.pp-icon,.pp-ghost{white-space:nowrap;border:1px solid rgba(245,239,230,.4);background:transparent;color:#F5EFE6;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.pp-icon{padding:5px 10px;font-size:14px;line-height:1;}
.pp-tabs{background:var(--pp-wine-d);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:0;z-index:4;scrollbar-width:none;}
.pp-tabs::-webkit-scrollbar{display:none;}
.pp-tabs button{border:none;background:none;color:rgba(245,239,230,.65);font-size:13px;font-weight:700;padding:12px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;position:relative;}
.pp-tabs button.on{color:#F5EFE6;border-bottom-color:var(--pp-gold);}
.pp-tabs .pp-n{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--pp-coral);color:#fff;font-size:10px;line-height:16px;text-align:center;margin-left:4px;padding:0 4px;}
.pp-main{max-width:640px;margin:0 auto;padding:18px 14px 0;}
.pp-h{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;}
.pp-h small{font-family:'Pretendard';font-size:11.5px;color:var(--pp-slate);font-weight:500;}
.pp-hello-t{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;}
.pp-hello-s{font-size:13px;color:var(--pp-soft);margin-top:4px;line-height:1.6;}
.pp-hello-s b{color:var(--pp-wine);}
.pp-alert{margin-top:14px;background:var(--pp-coral-s);color:var(--pp-coral);border:1px solid #EBC3B8;border-radius:10px;padding:11px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.pp-alert button{border:none;background:var(--pp-coral);color:#fff;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.pp-stat{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:10px;padding:11px 12px;}
.pp-stat span{font-size:11px;color:var(--pp-soft);font-weight:600;display:block;}
.pp-stat b{font-family:'Noto Serif KR',serif;font-size:17px;display:block;margin-top:3px;}
.pp-card{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:14px;padding:15px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(36,31,34,.05);position:relative;overflow:hidden;}
.pp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pp-wine);}
.pp-card.today::before{background:var(--pp-gold);}
.pp-card.soon::before{background:var(--pp-coral);}
.pp-card.past{opacity:.72;}
.pp-card.past::before{background:var(--pp-slate);}
.pp-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pp-dday{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:var(--pp-wine);}
.pp-card.today .pp-dday{color:var(--pp-gold);}
.pp-card.soon .pp-dday{color:var(--pp-coral);}
.pp-date{font-weight:700;font-size:13.5px;}
.pp-prod{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--pp-wine);color:#fff;}
.pp-venue{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;margin-top:8px;}
.pp-venue small{font-family:'Pretendard';font-size:12px;color:var(--pp-soft);font-weight:600;margin-left:4px;}
.pp-timeline{display:flex;align-items:center;margin:12px 0 10px;background:#F3F1E9;border-radius:10px;padding:9px 10px;}
.pp-timeline>div{flex:0 0 auto;text-align:center;min-width:64px;}
.pp-timeline>div span{display:block;font-size:10.5px;color:var(--pp-soft);font-weight:600;}
.pp-timeline>div b{font-size:16px;font-weight:700;}
.pp-timeline>div:first-child b{color:var(--pp-wine);}
.pp-timeline i{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--pp-line) 0 5px,transparent 5px 9px);margin:12px 4px 0;}
.pp-meta{display:grid;gap:6px;font-size:12.8px;}
.pp-meta>div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.pp-meta span{width:74px;flex-shrink:0;color:var(--pp-slate);font-size:11.5px;font-weight:600;}
.pp-meta em{font-style:normal;font-weight:700;font-size:11.5px;background:var(--pp-sage-s);color:var(--pp-sage);padding:2px 8px;border-radius:5px;margin-right:4px;}
.pp-meta .ok{color:var(--pp-sage);}
.pp-meta .wait{color:var(--pp-coral);}
.pp-team{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.pp-mate{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pp-line);border-radius:999px;padding:4px 10px 4px 7px;font-size:12px;background:#fff;}
.pp-mate i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.pp-mate a{color:var(--pp-wine);text-decoration:none;font-weight:700;}
.pp-mate.me{border-color:var(--pp-wine);}
.pp-note{margin-top:10px;background:var(--pp-gold-s);border-radius:9px;padding:9px 12px;font-size:12.5px;color:#6B531F;white-space:pre-wrap;line-height:1.6;}
.pp-progress{height:6px;background:#E6E3D8;border-radius:3px;overflow:hidden;margin-top:12px;}
.pp-progress div{height:100%;background:linear-gradient(90deg,var(--pp-wine),var(--pp-gold));}
.pp-progress-l{font-size:11px;color:var(--pp-soft);margin-top:4px;}
.pp-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;}
.pp-btn{border:1px solid var(--pp-line);background:#fff;color:var(--pp-ink);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
.pp-btn:hover{border-color:var(--pp-wine);color:var(--pp-wine);}
.pp-btn.primary{background:var(--pp-wine);border-color:var(--pp-wine);color:#fff;}
.pp-btn.gold{background:var(--pp-gold);border-color:var(--pp-gold);color:#fff;}
.pp-btn:disabled{opacity:.5;cursor:default;}
.pp-confirmed{font-size:12px;font-weight:700;color:var(--pp-sage);background:var(--pp-sage-s);border-radius:8px;padding:8px 11px;}
.pp-empty{text-align:center;color:var(--pp-soft);font-size:13px;padding:34px 10px;background:var(--pp-card);border:1px dashed var(--pp-line);border-radius:12px;}
.pp-cal{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:10px;}
.pp-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pp-cal-head b{font-family:'Noto Serif KR',serif;font-size:15px;}
.pp-cal-head button{border:1px solid var(--pp-line);background:#fff;border-radius:7px;width:32px;height:30px;cursor:pointer;font-size:13px;}
.pp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.pp-cal-wd{text-align:center;font-size:10.5px;font-weight:700;color:var(--pp-soft);padding:3px 0;}
.pp-cal-wd.we{color:var(--pp-wine);}
.pp-day{min-height:50px;border-radius:7px;background:#fff;border:1px solid #ECEAE0;padding:4px;font-size:11px;cursor:pointer;position:relative;text-align:left;color:var(--pp-ink);}
.pp-day.out{visibility:hidden;}
.pp-day.today{border-color:var(--pp-gold);box-shadow:inset 0 0 0 1px var(--pp-gold);}
.pp-day.we .pp-dn{color:var(--pp-wine);}
.pp-day.sel{background:var(--pp-gold-s);}
.pp-day.locked{cursor:not-allowed;background:#F4F3EE;color:#AAA59A;}
.pp-dn{font-weight:700;font-size:11.5px;}
.pp-ev{display:block;margin-top:3px;background:var(--pp-wine);color:#fff;border-radius:4px;font-size:9.5px;font-weight:700;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pp-av{display:block;margin-top:3px;border-radius:4px;font-size:9.5px;font-weight:700;padding:1px 3px;text-align:center;}
.pp-av.off{background:#E4E1D7;color:#6B6558;}
.pp-av.am{background:#E4E7EF;color:#3E5079;}
.pp-av.pm{background:#EFE3C6;color:#8A6A2A;}
.pp-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--pp-soft);margin:10px 2px 0;}
.pp-legend span{display:inline-flex;align-items:center;gap:4px;}
.pp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.pp-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.pp-chip{flex-shrink:0;border:1px solid var(--pp-line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--pp-ink);}
.pp-chip.on{background:var(--pp-wine);border-color:var(--pp-wine);color:#fff;}
.pp-phase{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.pp-phase-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F3F1E9;font-size:12.5px;font-weight:700;}
.pp-phase-h small{font-weight:600;color:var(--pp-soft);}
.pp-phase-h small.late{color:var(--pp-coral);}
.pp-check{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid #EFEDE3;font-size:13.5px;cursor:pointer;line-height:1.5;}
.pp-check input{width:19px;height:19px;accent-color:var(--pp-wine);flex-shrink:0;margin-top:1px;}
.pp-check.done span{color:var(--pp-slate);text-decoration:line-through;}
.pp-list-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid #EFEDE3;font-size:12.8px;}
.pp-list-row:first-child{border-top:none;}
.pp-box{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;overflow:hidden;}
.pp-select{border:1px solid var(--pp-line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;background:#fff;}
.pp-notice{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.pp-notice.pin{border-color:var(--pp-gold);}
.pp-notice h4{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;}
.pp-notice h4 em{font-style:normal;font-size:10.5px;background:var(--pp-gold);color:#fff;border-radius:4px;padding:1px 6px;}
.pp-notice p{margin:8px 0 0;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--pp-soft);}
.pp-notice time{display:block;font-size:11px;color:var(--pp-slate);margin-top:8px;}
.pp-foot{text-align:center;font-size:11px;color:var(--pp-slate);margin-top:26px;}
.pp-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pp-ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.pp-toast.show{opacity:1;}
.pp-busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pp-gold),var(--pp-wine));z-index:700;animation:ppbusy 1s linear infinite;}
@keyframes ppbusy{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
details.pp-past summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--pp-soft);margin:18px 2px 10px;}
@media (max-width:420px){.pp-timeline>div{min-width:54px;} .pp-timeline>div b{font-size:14.5px;} .pp-stat b{font-size:15px;}}

.pp-worknote{font-size:11px;color:var(--pp-slate);line-height:1.6;margin:-4px 0 10px;}

/* ---------- 모먼트웍스 브랜드 테마 (아이보리 · 먹색 · 골드) ---------- */
.pp{--pp-ink:#1A1618;--pp-soft:#6F685E;--pp-paper:#F7F5F0;--pp-card:#FFFFFF;--pp-line:#E5DFD3;--pp-wine:#1A1618;--pp-wine-d:#1A1618;--pp-gold:#A9823C;--pp-gold-s:#F4EDDD;--pp-sage:#4F6F52;--pp-sage-s:#EAF0E9;--pp-coral:#B24A35;--pp-coral-s:#F7E7E2;--pp-slate:#8A8378;}
.pp-top{background:var(--pp-paper);color:var(--pp-ink);border-bottom:1px solid var(--pp-line);padding:18px 18px 16px;align-items:center;}
.pp-brand{color:var(--pp-gold);letter-spacing:.2em;}
.pp-who{color:var(--pp-ink);font-weight:600;}
.pp-dot{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--pp-line);}
.pp-role{background:var(--pp-gold-s);color:#7A5E27;border-radius:2px;}
.pp-icon,.pp-ghost{border:1px solid var(--pp-line);color:var(--pp-ink);background:#fff;border-radius:2px;}
.pp-icon:hover,.pp-ghost:hover{border-color:var(--pp-ink);}
.pp-mark{height:40px;opacity:1;}
.pp-brandrow{gap:14px;}
.pp-brandrow>div{border-left:1px solid var(--pp-line);padding-left:14px;}
.pp-tabs{background:rgba(247,245,240,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--pp-line);}
.pp-tabs button{color:#9A9388;border-bottom:1px solid transparent;margin-bottom:-1px;font-weight:600;letter-spacing:.02em;}
.pp-tabs button.on{color:var(--pp-ink);border-bottom-color:var(--pp-ink);}
.pp-hello-t{font-weight:600;letter-spacing:-.01em;}
.pp-hello-s b{color:var(--pp-ink);border-bottom:1px solid var(--pp-gold);}
.pp-stat,.pp-card,.pp-box,.pp-cal,.pp-phase,.pp-notice,.pp-empty{border-radius:4px;box-shadow:0 1px 2px rgba(26,22,24,.035);border-color:var(--pp-line);}
.pp-stat{border-top:2px solid var(--pp-gold);}
.pp-stat b{font-weight:600;}
.pp-card::before{width:2px;background:var(--pp-ink);}
.pp-card.today::before{background:var(--pp-gold);}
.pp-dday{font-weight:600;color:var(--pp-ink);}
.pp-card.today .pp-dday{color:var(--pp-gold);}
.pp-venue{font-weight:600;}
.pp-prod{background:var(--pp-ink);border-radius:2px;}
.pp-timeline{background:#FBFAF6;border:1px solid #F1EDE5;border-radius:4px;}
.pp-timeline>div:first-child b{color:var(--pp-ink);border-bottom:1px solid var(--pp-gold);}
.pp-meta em{background:#F3F0E8;color:var(--pp-ink);border-radius:2px;}
.pp-mate{border-radius:2px;}
.pp-mate a{color:var(--pp-ink);}
.pp-note{background:#FBF7EE;border:1px solid #EADFC6;border-radius:4px;}
.pp-progress{height:3px;border-radius:0;background:#EFEBE3;}
.pp-progress div{background:linear-gradient(90deg,var(--pp-ink),var(--pp-gold));}
.pp-btn{border-radius:2px;}
.pp-btn:hover{border-color:var(--pp-ink);color:var(--pp-ink);}
.pp-btn.primary{background:var(--pp-ink);border-color:var(--pp-ink);}
.pp-btn.primary:hover{background:#fff;color:var(--pp-ink);}
.pp-confirmed{border-radius:2px;}
.pp-alert{border-radius:4px;}
.pp-alert button{border-radius:2px;}
.pp-chip{border-radius:2px;}
.pp-chip.on{background:var(--pp-ink);border-color:var(--pp-ink);}
.pp-phase-h{background:#FBFAF6;}
.pp-day{border-radius:2px;border-color:#EFEBE3;}
.pp-ev{background:var(--pp-ink);border-radius:2px;}
.pp-cal-head b{font-weight:600;}
.pp-cal-head button{border-radius:2px;border-color:var(--pp-line);}
.pp-select{border-radius:2px;}
.pp-check input{accent-color:var(--pp-ink);}
.pp-notice.pin{border-color:#EADFC6;border-top:2px solid var(--pp-gold);}
.pp-notice h4 em{border-radius:2px;}
.pp-foot{margin-top:40px;letter-spacing:.02em;}
.pp-foot img{height:28px;width:auto;display:block;margin:0 auto 10px;opacity:.8;}
.pp-foot b{display:block;font-size:10px;letter-spacing:.34em;padding-left:.34em;color:var(--pp-soft);font-weight:600;margin-bottom:6px;}
.pp-preview{background:var(--pp-ink);}

/* ---------- 색 대비 강화 (포털) ---------- */
.pp{--pp-paper:#EEE9DF;--pp-line:#D6CDBD;--pp-ink:#171315;--pp-soft:#4E4740;--pp-slate:#766F64;--pp-gold:#A9823C;--pp-coral:#B0432E;--pp-sage:#3D6A45;}
.pp-top{background:#FBF9F4;}
.pp-tabs{background:#1C1719 !important;border-bottom:3px solid var(--pp-gold);}
.pp-tabs button{color:#B8AFA2;border-bottom:none;margin-bottom:0;}
.pp-tabs button.on{color:#1C1719;background:var(--pp-gold);border-bottom:none;font-weight:700;}
.pp-tabs .pp-n{background:#fff;color:var(--pp-coral);}
.pp-h{padding-left:10px;border-left:4px solid var(--pp-gold);}
.pp-stat{border-top:3px solid var(--pp-gold);box-shadow:0 2px 8px rgba(23,19,21,.05);}
.pp-card{border:1px solid var(--pp-line);box-shadow:0 2px 10px rgba(23,19,21,.06);}
.pp-card::before{width:5px;background:var(--pp-ink);}
.pp-card.soon::before{background:var(--pp-coral);}
.pp-card.today::before{background:var(--pp-gold);}
.pp-timeline{background:#2A2426;border:none;}
.pp-timeline>div span{color:#CFC5B6;}
.pp-timeline>div b{color:#F7F2E8;}
.pp-timeline>div:first-child b{color:#F2C27A;border-bottom-color:#F2C27A;}
.pp-timeline i{background:repeating-linear-gradient(90deg,#6B625A 0 5px,transparent 5px 9px);}
.pp-worknote{color:var(--pp-slate);}
.pp-meta em{background:var(--pp-ink);color:#fff;}
.pp-prod{background:var(--pp-gold);color:#1C1719;}
.pp-btn{border-color:#B9AE9A;}
.pp-btn:hover{background:var(--pp-ink);color:#fff;border-color:var(--pp-ink);}
.pp-btn.primary{background:var(--pp-ink);}
.pp-btn.primary:hover{background:var(--pp-gold);border-color:var(--pp-gold);color:#1C1719;}
.pp-confirmed{background:var(--pp-sage);color:#fff;}
.pp-alert{background:var(--pp-coral);color:#fff;border:none;}
.pp-alert button{background:#fff;color:var(--pp-coral);}
.pp-phase-h{background:#2A2426;color:#F3EDE2;}
.pp-phase-h small{color:#CFC5B6;}
.pp-phase-h small.late{color:#F2A08E;}
.pp-check:nth-child(odd){background:#FAF7F1;}
.pp-cal-wd{background:#2A2426;color:#F3EDE2;border-radius:2px;}
.pp-cal-wd.we{color:#F2C27A;}
.pp-day{border-color:#E1D9CB;}
.pp-day.today{box-shadow:inset 0 0 0 2px var(--pp-gold);border-color:var(--pp-gold);}
.pp-chip{border-color:#B9AE9A;}
.pp-list-row:nth-child(even){background:#FAF7F1;}
.pp-notice.pin{border-top:3px solid var(--pp-gold);}

/* ===== 오늘 업무 진행 ===== */
.pw-start{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;border:none;border-radius:12px;background:linear-gradient(135deg,var(--pp-wine-d),var(--pp-wine));color:#fff;padding:16px 18px;margin:12px 0 4px;text-align:left;font:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(92,31,41,.25);}
.pw-start span{font-size:12px;color:var(--pp-gold-s);font-weight:600;}
.pw-start b{font-size:17px;}
.pw-learn{width:100%;border:1px dashed var(--pp-gold);background:var(--pp-gold-s);color:var(--pp-ink);border-radius:10px;padding:11px 14px;margin:12px 0 4px;font:inherit;font-size:13px;text-align:left;cursor:pointer;}
.pw-learn b{color:var(--pp-wine);}
.pw-intro{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;}
.pw-intro p{margin:6px 0 0;color:var(--pp-soft);}
.pw-head{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;font-size:13px;}
.pw-head b{font-size:15px;} .pw-head small{color:var(--pp-slate);}
.pw-times{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:12px;color:var(--pp-soft);}
.pw-times b{font-size:14px;color:var(--pp-ink);}
.pw-meta{font-size:12px;color:var(--pp-soft);line-height:1.7;}
.pw-meta a{text-decoration:none;}
.pw-cur{margin:14px 0;background:#fff;border:2px solid var(--pp-wine);border-radius:14px;padding:16px;box-shadow:0 8px 22px rgba(36,31,34,.10);}
.pw-cur.fin{border-color:var(--pp-sage);text-align:center;}
.pw-cur-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--pp-wine);}
.pw-cur-top b{background:var(--pp-gold-s);color:var(--pp-wine-d);padding:3px 9px;border-radius:999px;letter-spacing:0;}
.pw-cur h3{font-size:20px;margin:8px 0 6px;}
.pw-cur p{font-size:13.5px;line-height:1.7;color:var(--pp-soft);margin:0 0 10px;}
.pw-tag{display:inline-block;font-size:12px;font-weight:700;background:var(--pp-coral-s);color:var(--pp-coral);padding:4px 10px;border-radius:999px;margin-bottom:10px;}
.pw-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pw-done{width:100%;border:none;border-radius:12px;background:var(--pp-sage);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;}
.pw-done:active{transform:scale(.99);}
.pw-list{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.pw-step{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--pp-line);cursor:pointer;}
.pw-step:last-child{border-bottom:none;}
.pw-step.cur{background:var(--pp-gold-s);}
.pw-step.done .pw-st b{color:var(--pp-slate);text-decoration:line-through;}
.pw-no{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#E8E4D8;color:var(--pp-soft);}
.pw-step.done .pw-no{background:var(--pp-sage);color:#fff;}
.pw-step.cur .pw-no{background:var(--pp-wine);color:#fff;}
.pw-st{display:flex;flex-direction:column;gap:2px;min-width:0;}
.pw-st b{font-size:13.5px;} .pw-st small{font-size:11.5px;color:var(--pp-slate);}
.pw-guide{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;overflow:hidden;}
.pw-g{border-bottom:1px solid var(--pp-line);}
.pw-g:last-child{border-bottom:none;}
.pw-g summary{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13.5px;font-weight:700;cursor:pointer;list-style:none;}
.pw-g summary::-webkit-details-marker{display:none;}
.pw-g summary small{margin-left:auto;font-size:11px;color:var(--pp-slate);font-weight:600;white-space:nowrap;}
.pw-g p{margin:0;padding:0 14px 10px 50px;font-size:12.5px;line-height:1.7;color:var(--pp-soft);}
.pw-msgprev{margin:0 14px 12px 50px;background:#fff;border:1px solid var(--pp-line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;color:var(--pp-soft);}
.pw-msgprev b{display:block;color:var(--pp-wine);margin-bottom:2px;}
.pw-bar{position:sticky;bottom:10px;display:flex;gap:8px;margin-top:14px;z-index:3;}
.pw-bar button,.pw-bar a{flex:1;border:none;border-radius:12px;padding:14px;font:inherit;font-size:14.5px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px rgba(36,31,34,.18);}
.pw-bar button{background:var(--pp-coral);color:#fff;}
.pw-bar a{background:#fff;color:var(--pp-ink);border:1px solid var(--pp-line);}
.pw-sheet-bg{position:fixed;inset:0;background:rgba(20,16,18,.45);z-index:50;}
.pw-sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--pp-paper);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:51;max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.pw-sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pw-sheet-h b{font-size:16px;}
.pw-sheet-h button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--pp-soft);}
.pw-sheet-sub{font-size:11.5px;color:var(--pp-slate);line-height:1.6;margin:8px 0 0;}
.pw-sheet textarea{width:100%;box-sizing:border-box;border:1px solid var(--pp-line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.6;background:#fff;resize:vertical;}
.pw-recs{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.pw-rec{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--pp-line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;}
.pw-rec small{display:block;font-size:11px;color:var(--pp-slate);font-weight:500;}
.pw-rec input{flex:1;border:1px solid var(--pp-line);border-radius:8px;padding:8px;font:inherit;}
.pw-sheet-acts{display:flex;gap:8px;}
.pw-sheet-acts .pp-btn{flex:1;padding:12px;}
.pw-sheet-acts .primary{background:#FEE500;color:#191600;border-color:#FEE500;}
.pw-rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.pw-rgrid button{border:1px solid var(--pp-line);background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit;cursor:pointer;}
.pw-rgrid b{display:block;font-size:14px;} .pw-rgrid small{font-size:11px;color:var(--pp-slate);}
.pw-kakao-to{display:flex;align-items:center;gap:10px;background:#FEE500;border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.pw-kk{flex:0 0 auto;background:#3C1E1E;color:#FEE500;font-size:10px;font-weight:900;letter-spacing:.04em;border-radius:6px;padding:5px 6px;}
.pw-kakao-to b{display:block;font-size:13.5px;color:#191600;}
.pw-kakao-to small{font-size:11px;color:#4A3F00;}
.pw-kakao-btn{width:100%;margin-top:10px;border:none;border-radius:12px;background:#FEE500;color:#191600;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.pw-kakao-steps{margin:10px 0 0;padding-left:18px;font-size:12px;line-height:1.7;color:var(--pp-soft);}
.pw-photo-btn{display:block;width:100%;margin:0 0 10px;border:2px dashed var(--pp-coral);background:var(--pp-coral-s);color:var(--pp-coral);border-radius:12px;padding:12px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;}
.pw-bar button.ph{background:#fff;color:var(--pp-ink);border:1px solid var(--pp-line);}
.pw-photo-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pw-cam{display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--pp-wine);color:#fff;font-weight:800;font-size:14.5px;padding:16px 8px;cursor:pointer;}
.pw-cam.alt{background:#fff;color:var(--pp-ink);border:1px solid var(--pp-line);}
.pw-cam input{display:none;}
.pw-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.pw-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd;}
.pw-thumb img{width:100%;height:100%;object-fit:cover;}
.pw-thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;}
.pw-kakao-btn:disabled{opacity:.45;cursor:default;}
.pp-install{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--pp-line);border-radius:12px;padding:10px 12px;margin:10px 0 2px;font-size:13px;}
.pp-install span{flex:1;} .pp-install b{color:var(--pp-wine);}
.pp-install button{border:none;background:var(--pp-wine);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.pp-install button.x{background:none;color:var(--pp-slate);padding:4px 6px;}
.pp-install-link{border:1px solid var(--pp-line);background:#fff;color:var(--pp-ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.pp-sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:transparent;margin-right:2px;align-self:center;transition:background .2s;}
.pp-sync.on{background:var(--pp-gold);animation:ppPulse 1s ease-in-out infinite;}
@keyframes ppPulse{0%,100%{opacity:.35}50%{opacity:1}}
.pw-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pw-fields label{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--pp-line);border-radius:12px;padding:10px 12px;position:relative;}
.pw-fields span{font-size:12.5px;font-weight:800;color:var(--pp-wine);}
.pw-fields input{border:none;outline:none;font:inherit;font-size:26px;font-weight:800;width:100%;padding:0;background:transparent;font-variant-numeric:tabular-nums;}
.pw-fields em{position:absolute;right:12px;bottom:12px;font-style:normal;font-size:13px;color:var(--pp-slate);font-weight:700;}
.pw-fields input::-webkit-outer-spin-button,.pw-fields input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;} .pw-fields input{-moz-appearance:textfield;appearance:textfield;padding-right:24px;}

/* 상단 아이콘 버튼 (새로고침 · 로그아웃) */
.pp-top .pp-icon{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--pp-line);background:#fff;color:var(--pp-soft);transition:color .15s,border-color .15s,background .15s;}
.pp-top .pp-icon:hover{color:var(--pp-wine);border-color:var(--pp-gold);background:#FFFDF8;}
.pp-top .pp-icon:active svg{transform:scale(.92);}
.pp-busy ~ .pp-top .pp-icon[data-pp=refresh] svg{animation:ppSpin .8s linear infinite;}
@keyframes ppSpin{to{transform:rotate(360deg)}}
.pp-top-actions{align-items:center;}

/* 배정 확인 완료 → 한 번 더 누르면 취소 */
.pp-unconfirm{border:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.pp-unconfirm small{font-size:10.5px;font-weight:600;opacity:.75;border-left:1px solid currentColor;padding-left:7px;}
.pp-unconfirm:hover{filter:brightness(.92);}

.pp-logo-btn{border:none;background:none;padding:0;margin:0;cursor:pointer;display:block;line-height:0;-webkit-tap-highlight-color:transparent;}
.pp-logo-btn:active img{transform:scale(.95);}

/* 예식 정보 (파트너 안내카드) */
.pp-info{margin:10px 0 12px;border:1px solid var(--pp-line,#e7dfd3);border-radius:12px;background:#fffdf9;overflow:hidden;}
.pp-info>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.pp-info>summary::-webkit-details-marker{display:none;}
.pp-info>summary::after{content:'▾';margin-left:auto;color:var(--pp-slate);transition:transform .2s;}
.pp-info[open]>summary::after{transform:rotate(180deg);}
.pp-info>summary small{font-weight:500;color:var(--pp-slate);font-size:11px;}
.pp-info-sec{padding:2px 14px 12px;}
.pp-info-sec h4{margin:10px 0 6px;font-size:12px;letter-spacing:.04em;color:var(--pp-wine,#7a2e3a);border-bottom:1px solid var(--pp-line,#e7dfd3);padding-bottom:4px;}
.pp-info-kv>div{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.55;}
.pp-info-kv span{color:var(--pp-slate);}
.pp-info-kv b{font-weight:600;word-break:keep-all;overflow-wrap:anywhere;}
.pp-info-note{margin:6px 0 0;font-size:12px;color:var(--pp-slate);}
.pp-info-empty{padding:2px 14px 13px;font-size:12.5px;color:var(--pp-slate);}

/* 현장 연락처 (식권 전달자 · 인계받는 분 · 비상연락망) */
.pp-contacts{margin:10px 0 12px;border:1.5px solid var(--pp-wine,#7a2e3a);border-radius:12px;background:#fff;overflow:hidden;}
.pp-contacts-h{padding:9px 14px;background:var(--pp-wine,#7a2e3a);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;}
.pp-contacts-h small{font-weight:500;opacity:.8;font-size:11px;margin-left:auto;}
.pp-ct-group{padding:8px 14px;border-top:1px solid var(--pp-line,#e7dfd3);}
.pp-ct-group:first-of-type{border-top:0;}
.pp-ct-title{font-size:11.5px;font-weight:700;color:var(--pp-wine,#7a2e3a);margin-bottom:4px;}
.pp-ct-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.pp-ct-name{flex:1;min-width:0;font-weight:700;font-size:14px;display:flex;flex-direction:column;}
.pp-ct-name small{font-weight:500;font-size:11.5px;color:var(--pp-slate);}
.pp-ct-btn{flex:none;text-decoration:none;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--pp-line,#d9d0c2);color:var(--pp-ink,#222);background:#faf6ee;}
.pp-ct-btn.call{background:var(--pp-wine,#7a2e3a);border-color:var(--pp-wine,#7a2e3a);color:#fff;}
.pp-ct-none{font-size:11.5px;color:var(--pp-slate);}

.pp-info-h{padding:11px 14px 4px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.pp-info-h small{font-weight:500;color:var(--pp-slate);font-size:11px;}
.pp-info-top{margin:2px 0 12px;font-size:13px;line-height:1.6;}
.pp-info-top .pp-dday{margin-right:8px;}

.pp-info-intro{font-size:12px;color:var(--pp-slate);margin:2px 0 12px;}
.pp-info-event{margin-bottom:26px;padding-bottom:6px;border-bottom:2px dashed var(--pp-line,#e7dfd3);}
.pp-info-event:last-child{border-bottom:0;}
.pp-info-top{padding:10px 12px;border-radius:12px;background:#2a2622;color:#fff;margin-bottom:10px;}
.pp-info-top .pp-dday{color:#d9b56a;}
.pp-sum{border-top:1px solid var(--pp-line,#e7dfd3);margin-top:4px;}
.pp-sum-h{padding:12px 14px 2px;font-weight:700;font-size:13px;}
.pp-sum-h small{font-weight:500;color:var(--pp-slate);font-size:11px;margin-left:6px;}
.pp-info-more{padding:4px 14px 14px;}

/* 파트너 안내카드 양식 */
.pp-card-brief{margin:4px 14px 10px;padding:12px 14px;border-radius:12px;background:#f6f1e4;border:1px solid #e3d8bb;}
.pp-cb-names{font-size:17px;font-weight:800;letter-spacing:.01em;}
.pp-cb-names i{font-style:normal;color:#9a7b2f;margin:0 4px;}
.pp-cb-pack{font-size:12px;color:#6f5a20;margin-top:2px;}
.pp-cb-when{font-size:12.5px;line-height:1.7;margin-top:8px;color:#3b372f;}
.pp-qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 14px 6px;}
.pp-qcell{border:1px solid var(--pp-line,#e7dfd3);border-radius:10px;padding:8px 10px;background:#fff;}
.pp-qcell span{display:block;font-size:11px;color:var(--pp-slate);margin-bottom:2px;}
.pp-qcell b{font-size:13px;}
.pp-nil{color:#b9b2a1!important;font-weight:400!important;}
.pp-tel{color:var(--pp-wine,#7a2e3a);text-decoration:underline;text-underline-offset:2px;}
.pp-vip{overflow-x:auto;}
.pp-vip table{width:100%;border-collapse:collapse;font-size:12px;}
.pp-vip th{background:#f3efe2;font-weight:700;text-align:left;padding:5px 7px;border:1px solid #e3d8bb;white-space:nowrap;}
.pp-vip td{padding:5px 7px;border:1px solid #eee6d3;vertical-align:top;}

.pp-cb-tels{margin-top:4px;font-size:13px;line-height:1.6;font-weight:600}.pp-cb-tels .pp-tel{font-weight:800}

.pp-url{color:#2563eb;text-decoration:underline;word-break:break-all;font-weight:700}

.pp-ok-badge{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;line-height:1;padding:3px 6px;margin-left:5px;border-radius:999px;background:#2F7D57;color:#fff;vertical-align:middle}
.pp-card-top .pp-ok-badge{margin-left:auto}
.pp-ev .pp-ok-badge{font-size:9px;padding:2px 4px;margin-left:2px}

.pp-newbn{background:#FFF6DF;border:1.5px solid #D9A93A;border-radius:12px;padding:12px 12px 10px;margin:0 0 14px;box-shadow:0 2px 10px rgba(180,130,20,.12)}
.pp-newbn-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px;color:#5A3E00}
.pp-newbn-h button{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:#7a5a10;padding:4px 8px}
.pp-newbn-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:#fff;border-radius:8px;padding:9px 10px;margin-bottom:6px;font-size:13px;cursor:pointer;color:inherit}
.pp-newbn-row span{flex:1}.pp-newbn-row i{font-style:normal;color:#999}
.pp-newbn-ok{width:100%;margin-top:2px}
.pp-newbn-row em,.pp-newtag{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#D64545;border-radius:999px;padding:3px 7px;line-height:1}
.pp-newbn-row em.chg,.pp-newtag.chg{background:#D9822B}
.pp-ev .pp-newtag{padding:2px 4px;font-size:9px}
.pp-card-top .pp-newtag{margin-left:6px}

.pp-pendhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px;font-size:14px}.pp-pendhead small{color:var(--pp-soft);font-weight:700}

.pp-others{margin:18px 0 6px;border:1px solid var(--pp-line);border-radius:12px;padding:10px 12px;background:#fff}
.pp-others summary{cursor:pointer;font-size:14px}.pp-others summary small{color:var(--pp-soft);font-weight:700}
.pp-others-note{font-size:11.5px;color:var(--pp-soft);margin:6px 0 10px}
.pp-other{border-top:1px dashed var(--pp-line);padding:9px 0}
.pp-other-top{display:flex;justify-content:space-between;font-size:13px}.pp-other-top span{color:var(--pp-soft);font-size:12px}
.pp-other-venue{font-size:13.5px;font-weight:700;margin:3px 0 6px}.pp-other-venue small{font-weight:400;color:var(--pp-soft)}

.pp-cfhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px;font-size:14px}.pp-cfhead small{color:var(--pp-soft);font-weight:700}
.pp-cflist{background:#fff;border:1px solid var(--pp-line);border-radius:12px;overflow:hidden}
.pp-cfrow{display:flex;align-items:center;gap:8px;padding:10px 10px;border-top:1px solid var(--pp-line);font-size:13px;white-space:nowrap}
.pp-cfrow:first-child{border-top:0}.pp-cfrow.done{background:#F7FAF8}
.pp-cf-date{font-weight:800;min-width:50px}.pp-cf-date small{font-weight:600;margin-left:3px;color:var(--pp-soft)}.pp-cf-date small.sun{color:#D64545}.pp-cf-date small.sat{color:#3B6FD1}
.pp-cf-time{font-weight:700;min-width:40px}
.pp-cf-venue{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pp-cf-region{color:var(--pp-soft);font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.pp-cf-btn{border:0;border-radius:8px;background:var(--pp-wine);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;cursor:pointer;flex:none}
.pp-cf-btn.ok{background:#E3F1E9;color:#2F7D57}
.pp-cf-note{font-size:11.5px;color:var(--pp-soft);text-align:center;margin-top:14px}
.pp-ar-url{font-size:13px;margin:8px 0 12px;word-break:break-all}.pp-ar-url a{color:var(--pp-brand,#2563eb);font-weight:700;text-decoration:underline}
.pp-ar-ev{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px}
.pp-ar-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;margin-bottom:8px}.pp-ar-h small{width:100%;color:#64748b}
.pp-ar-side{border-top:1px dashed #e5e7eb;padding:8px 0}.pp-ar-code{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.pp-ar-code span{color:#64748b}.pp-ar-code b{font-size:16px;letter-spacing:.5px;user-select:all}.pp-ar-code em{color:#94a3b8;font-style:normal}
.pp-ar-go{width:100%;padding:12px}.pp-ar-go[disabled]{opacity:.45}
/* 스마트폰용 월 달력 — 균등 7열, 일정 있는 주만 높게 */
.pp-sc{padding:14px 10px 10px;background:#FFFDF9;border:1px solid #E6DFD0;border-radius:14px;box-shadow:0 2px 10px rgba(60,40,30,.05)}
.pp-sc-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.pp-sc-head div{text-align:center;line-height:1.25}.pp-sc-head b{font-family:'Noto Serif KR',serif;font-size:17px;letter-spacing:.3px;color:var(--pp-ink);display:block}
.pp-sc-head small{font-size:10.5px;color:var(--pp-soft);letter-spacing:.4px}
.pp-sc-head button{width:34px;height:34px;border-radius:50%;border:1px solid #E6DFD0;background:#fff;color:var(--pp-ink);font-size:20px;line-height:1;cursor:pointer;padding:0 0 3px}
.pp-sc-wd,.pp-sc-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.pp-sc-wd{border-bottom:1px solid #D9D0BE;padding-bottom:6px;margin-bottom:2px}
.pp-sc-wd span{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:1px;color:#8A8274}.pp-sc-wd .sun{color:#B0483F}.pp-sc-wd .sat{color:#4A6FA5}
.pp-sc-week{border-bottom:1px solid #F0EADD}.pp-sc-week:last-of-type{border-bottom:0}
.pp-sc-week.quiet .pp-sc-day{min-height:32px;padding-top:6px}
.pp-sc-week.has .pp-sc-day{min-height:70px}
.pp-sc-day{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:6px 1px 4px;cursor:pointer;min-width:0;color:var(--pp-ink);border-radius:8px;font-family:inherit}
.pp-sc-dn{font-size:12.5px;font-weight:600;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-variant-numeric:tabular-nums}
.pp-sc-day.sun .pp-sc-dn{color:#B0483F}.pp-sc-day.sat .pp-sc-dn{color:#4A6FA5}
.pp-sc-day:not(.ev) .pp-sc-dn{color:#A39B8B;font-weight:500}.pp-sc-day.sun:not(.ev) .pp-sc-dn{color:#C9948E}.pp-sc-day.sat:not(.ev) .pp-sc-dn{color:#93A8C8}
.pp-sc-day.today .pp-sc-dn{background:var(--pp-gold,#B8924A);color:#fff;font-weight:800}
.pp-sc-day.sel{background:#F6EFE0}
.pp-sc-ev{display:flex;flex-direction:column;align-items:center;width:calc(100% - 4px);border-radius:6px;padding:3px 1px;line-height:1.2;position:relative;border-left:3px solid;overflow:hidden}
.pp-sc-ev b{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}.pp-sc-ev>span{font-size:9px;font-weight:600;max-width:100%;overflow:hidden;white-space:nowrap}
.pp-sc-ev.wait{background:#F8ECEA;color:#7A2E2A;border-color:#B0483F}.pp-sc-ev.ok{background:#E8F2EC;color:#25613F;border-color:#2F7D57}
.pp-sc-new{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#E0572F}
.pp-sc-av{font-size:9px;font-weight:700;color:#8A8274;background:#F1EDE3;border-radius:4px;padding:1px 4px}
.pp-sc-legend{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:10.5px;color:#8A8274}.pp-sc-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.pp-sc-legend i.ok{background:#2F7D57}.pp-sc-legend i.wait{background:#B0483F}
/* 배정 확인: 펼침 상세 · 지도 */

.pp-ev-list,.pp-ev-detail,.pp-ev-head,.pp-ev-tip,.pp-ev-row,.pp-d-next,.pp-d-today,.pp-d-grid button,.pp-d-day,.pp-d-pay,.pp-d-notices button,.pp-d-quick button,.pp-d-sec{color:var(--pp-ink,#241F22)}

/* ================= 접속 메인화면 (모먼트웍스 로고) ================= */
.mw-entry{position:fixed;inset:0;z-index:500;overflow-y:auto;background:#F7F5F0;background-image:radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #F7F5F0 55%, #EFEBE3 100%);color:#1A1618;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;padding:56px 22px;box-sizing:border-box;}
.mw-entry::before,.mw-entry::after{content:"";position:fixed;pointer-events:none;}
.mw-entry::before{inset:14px;border:1px solid rgba(26,22,24,.16);}
.mw-entry::after{inset:20px;border:1px solid rgba(169,130,60,.30);}
.mw-entry *{box-sizing:border-box;}
.mw-entry-inner{position:relative;z-index:1;width:100%;max-width:340px;text-align:center;animation:mwFade 1s cubic-bezier(.2,.7,.2,1) both;margin:auto 0;}

.mw-entry-label{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px 0 28px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#7E776C;padding-left:.22em;}
.mw-entry-label::before,.mw-entry-label::after{content:"";width:26px;height:1px;background:#C9B48A;}
.mw-tabs{display:flex;justify-content:center;gap:30px;margin:0 0 28px;}
.mw-tabs button{appearance:none;background:none;border:none;border-bottom:1px solid transparent;padding:0 2px 7px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.14em;color:#A39C90;cursor:pointer;transition:color .2s,border-color .2s;}
.mw-tabs button:hover{color:#1A1618;}
.mw-tabs button.active{color:#1A1618;border-bottom-color:#1A1618;}
.mw-field{text-align:left;margin-bottom:20px;}
.mw-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;color:#8A8378;margin-bottom:4px;}
.mw-field input{width:100%;border:none;border-bottom:1px solid #CFC8BA;border-radius:0;background:transparent;padding:10px 2px;font-family:inherit;font-size:15.5px;color:#1A1618;outline:none;transition:border-color .25s;-webkit-appearance:none;}
.mw-field input:focus{border-bottom-color:#1A1618;}
.mw-field input::placeholder{color:#C2BBAE;}
.mw-field input.code{text-align:center;letter-spacing:.28em;font-weight:600;font-size:19px;text-transform:uppercase;padding-left:.28em;}
.mw-note{font-size:12.5px;line-height:1.8;color:#6F685E;margin:0 0 24px;}
.mw-check{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#6F685E;margin:0 0 14px;cursor:pointer;}
.mw-check input{accent-color:#1A1618;width:14px;height:14px;margin:0;}
.mw-error{color:#A8432F;font-size:12px;line-height:1.55;min-height:18px;margin:2px 0 12px;}
.mw-btn{width:100%;border:1px solid #1A1618;border-radius:0;background:#1A1618;color:#F7F5F0;padding:15px 14px;font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.18em;cursor:pointer;transition:background .25s,color .25s;}
.mw-btn:hover{background:transparent;color:#1A1618;}
.mw-btn:disabled{opacity:.45;cursor:default;}
.mw-link{display:inline-block;background:none;border:none;margin-top:20px;font-family:inherit;font-size:11.5px;letter-spacing:.06em;color:#8A8378;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.mw-foot{margin:44px 0 0;font-size:10px;font-weight:600;letter-spacing:.3em;color:#ADA699;padding-left:.3em;}
.mw-loading{font-size:12px;letter-spacing:.26em;color:#8A8378;margin-top:36px;padding-left:.26em;}
.mw-loading::after{content:"";display:block;width:34px;height:1px;background:#1A1618;margin:16px auto 0;animation:mwLine 1.4s ease-in-out infinite;}
@keyframes mwFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes mwLine{0%,100%{transform:scaleX(.3);opacity:.35;}50%{transform:scaleX(1);opacity:1;}}
@media (max-height:640px){.mw-entry-logo{width:170px;} .mw-entry-label{margin:22px 0 20px;} .mw-foot{margin-top:28px;}}
/* 상단 모노그램 */
.mw-topmark{height:52px;width:auto;display:block;opacity:.95;}
.mw-topwrap{display:flex;align-items:center;gap:18px;}
.mw-topwrap .mw-topdiv{width:1px;align-self:stretch;background:rgba(245,239,230,.28);margin:4px 0;}
.pp-mark{height:34px;width:auto;display:block;opacity:.95;}
.pp-brandrow{display:flex;align-items:center;gap:12px;}
@media (max-width:560px){.mw-topmark{height:40px;} .mw-topwrap{gap:12px;}}
.mw-install{display:block;margin:18px auto 0;border:1px solid #CDBF9F;background:#fff;color:#1A1618;border-radius:999px;padding:10px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.mw-ig{position:fixed;inset:0;z-index:100000;display:flex;align-items:flex-end;justify-content:center;}
.mw-ig-bg{position:absolute;inset:0;background:rgba(20,16,18,.5);}
.mw-ig-card{position:relative;background:#F7F5F0;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.mw-ig-card img{width:64px;height:64px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.mw-ig-card h3{margin:10px 0 4px;font-size:18px;}
.mw-ig-sub{font-size:12.5px;color:#6F685E;margin:0 0 12px;}
.mw-ig-card ol{text-align:left;margin:0 0 14px;padding:0;list-style:none;counter-reset:s;}
.mw-ig-card li{counter-increment:s;position:relative;padding:10px 12px 10px 44px;background:#fff;border:1px solid #E5DFD3;border-radius:12px;margin-bottom:8px;font-size:14px;line-height:1.5;}
.mw-ig-card li::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#5C1F29;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.mw-ico{display:inline-block;border:1px solid #bbb;border-radius:4px;padding:0 4px;font-size:12px;}

</style>
</head>

/* =========================================================
   파트너스 공용 로직 (관리 페이지 · 파트너스오피스 · 구글 Apps Script 서버가 똑같이 사용)
   - 이 함수들은 toString()으로 Apps Script 코드에 그대로 복사되므로
     외부 변수에 의존하지 않도록 자기완결형으로 작성한다.
========================================================= */
function pvDefaultSettings(){
  return {
    callOffset: 90,          // 출근 시간 = 예식 시작 몇 분 전 (1시간 30분)
    workMinutes: 180,        // 근무 예상시간 = 출근부터 최대 몇 분 (3시간)
    timeModel: 2,
    bufferMinutes: 30,       // 같은 날 두 예식 사이 최소 이동시간
    slotsByProduct: {'양측':4,'한측':2,'통합':2}, // 시트 파트너1~4 기준 (한측 1·2 / 양측 1~4)
    slotModel: 2,
    ownerNames: ['김현관','송빛나'], // 대표로 구분할 이름
    preferOwners: true,      // 자동 배정 시 대표부부를 먼저 배정
    syncLabor: true,        // 배정 인건비를 계약 '인건비/파트너' 칸에 자동 반영
    showClientName: true,    // 파트너에게 계약자명 공개
    showTeamPhone: true,     // 같은 예식 팀원 연락처 공개
    minWage: 10320,          // 2026년 최저시급
    officeUrl: '',           // 분리 운영하는 파트너스오피스 주소
    availabilityLockDays: 3, // 예식 며칠 전부터 휴무 변경을 막을지
    responseHours: 48,       // 자동배정 후 이 시간 안에 확정/진행불가가 없으면 다음 순위로 자동 넘김 (0 = 사용 안 함)
    urgentDays: 7,           // 예식이 며칠 이내면 '급한 배정'
    urgentResponseHours: 48  // 급한 배정의 응답 기한(시간) · 기본은 일반 배정과 같은 48시간

  };
}

/* 파트너 안내카드의 연락처 3종 — 식권 전달자 · 축의금 인계받는 분 · 비상연락망
   운영설정서 항목의 이름(키/라벨)으로 찾아 맞추고, 값에서 이름과 전화번호를 나눠 통화·문자 버튼으로 씀 */
function partnerContacts(rows){
  var GROUPS = [
    {id:'ticket', title:'식권 전달자', icon:'🎫', re:/ticket|meal_?coupon|식권/i, not:/child|adult|소인|대인|수량|매수|count|age|나이|cross|교차|swap|reissue|invite|청첩|out|소진|응대|check|way|place|transfer|이체/i},
    {id:'handover', title:'축의금 인계받는 분', icon:'💌', re:/hand_?over|take_?over|receiv|인계|인수/i, not:/시간|방법|장소/},
    {id:'emergency', title:'비상연락망', icon:'🚨', re:/emerg|urgent|비상|긴급/i, not:null}
  ];
  var PH = /(?:\+?82[\s\-.]?)?0?1[016789][\s\-.]?\d{3,4}[\s\-.]?\d{4}|0\d{1,2}[\s\-.]\d{3,4}[\s\-.]\d{4}/g;
  var used = {}, groups = [];
  // 신랑 · 신부 연락처 (예식 기본정보) — 현장 연락처 맨 위에 둠
  var couple = [], nm = {};
  rows.forEach(function(r){ var k = String(r.key||''); if(k==='groom_name') nm.g = String(r.value||'').trim(); if(k==='bride_name') nm.b = String(r.value||'').trim(); });
  [['g','신랑',/^(?:groom_(?:phone|contact|tel)|신랑\s*연락처)$/i],['b','신부',/^(?:bride_(?:phone|contact|tel)|신부\s*연락처)$/i]].forEach(function(d){
    rows.forEach(function(r, i){
      if(used[i]) return;
      if(!(d[2].test(String(r.key||'').trim()) || d[2].test(String(r.label||'').trim()))) return;
      var f = String(r.value||'').match(PH); used[i] = true;
      if(f) couple.push({name: d[1] + (nm[d[0]] ? ' ' + nm[d[0]] : ''), phone: f[0].replace(/[^0-9+]/g,''), shown: f[0]});
    });
  });
  if(couple.length) groups.push({id:'couple', title:'신랑 · 신부', icon:'💍', people: couple});
  // 새 운영설정서: 관계 · 성함 · 연락처가 따로 있는 항목은 키로 정확히 짝지음
  var byK = {}, done = {}; rows.forEach(function(r, i){ if(r && r.key) byK[String(r.key)] = {v: String(r.value||'').trim(), i: i}; });
  [['ticket','식권 전달자','🎫',[['ticket_deliverer_relation','ticket_deliverer_name','ticket_deliverer_phone']]],
   ['handover','축의금 인계받는 분','💌',[['handover_relation_groom','handover_name_groom','handover_phone_groom'],['handover_relation_bride','handover_name_bride','handover_phone_bride']]],
   ['emergency','비상연락망','🚨',[['emg_1_relation','emg_1_name','emg_1_phone'],['emg_2_relation','emg_2_name','emg_2_phone']]]].forEach(function(S){
    var people = [];
    S[3].forEach(function(t){
      var rel = byK[t[0]], who = byK[t[1]], ph = byK[t[2]];
      if(!rel && !who && !ph) return;
      [rel, who, ph].forEach(function(x){ if(x) used[x.i] = true; });
      var f = ph ? ph.v.match(PH) : null, name = [rel && rel.v, who && who.v].filter(function(x){ return x && x!=='-'; }).join(' ');
      if(f) people.push({name: name, phone: f[0].replace(/[^0-9+]/g,''), shown: f[0]}); else if(name) people.push({name: name, phone: '', shown: ''});
    });
    if(people.length){ groups.push({id:S[0], title:S[1], icon:S[2], people: people}); done[S[0]] = true; }
  });
  GROUPS.forEach(function(G){
    if(done[G.id]) return;
    var mine = [];
    rows.forEach(function(r, i){ var t = String(r.key||'')+' '+String(r.label||''); if(G.re.test(t) && !(G.not && G.not.test(t)) && !used[i]){ mine.push({r:r, i:i}); } });
    var people = [], names = [], phones = [];
    mine.forEach(function(m){
      var v = String(m.r.value||''), found = v.match(PH) || [];
      if(found.length){
        // '이름 010-0000-0000 / 이름 010-…' 처럼 한 칸에 여러 명
        var parts = v.split(/\n|\/|;|,|·|\|/).map(function(x){ return x.trim(); }).filter(function(x){ return x; });
        var added = 0;
        parts.forEach(function(pt){
          var ph = pt.match(PH); if(!ph) return;
          var name = pt.replace(PH,'').replace(/[()\[\]:：\-]/g,' ').replace(/\s+/g,' ').trim();
          people.push({name: name, phone: ph[0].replace(/[^0-9+]/g,''), shown: ph[0]}); added++;
        });
        if(!added) found.forEach(function(ph){ people.push({name:'', phone: ph.replace(/[^0-9+]/g,''), shown: ph}); });
        used[m.i] = true;
      } else if(v.length<=24 && !/\d{4,}/.test(v) && /name|성함|이름|person|holder|deliver|전달|담당|인수|인계/i.test(String(m.r.key||'')+' '+String(m.r.label||''))){ names.push({v:v, i:m.i}); }
    });
    // 이름 칸과 전화번호 칸이 따로 있을 때 순서대로 짝짓기
    if(names.length){
      var nameless = people.filter(function(p){ return !p.name; });
      if(nameless.length){ nameless.forEach(function(p, k){ if(names[k]){ p.name = names[k].v; used[names[k].i] = true; } }); }
      else if(!people.length){ /* 이름만 있고 번호가 없으면 연락 버튼 없이 이름만 */ names.forEach(function(n){ people.push({name:n.v, phone:'', shown:''}); used[n.i] = true; }); }
    }
    if(people.length){ groups.push({id:G.id, title:G.title, icon:G.icon, people: people.slice(0,6)}); }
  });
  return {groups: groups, rest: rows.filter(function(r, i){ return !used[i]; })};
}

function buildPartnerView(records, db, code, todayStr){
  function norm(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
  function toMin(s){ var m=/^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m ? (+m[1])*60+(+m[2]) : null; }
  function toHm(n){ if(n===null||n===undefined) return ''; n=((n%1440)+1440)%1440; var h=Math.floor(n/60), mi=n%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
  function mask(name){ name=String(name||''); if(name.length<2) return name; if(name.length===2) return name[0]+'*'; return name[0]+new Array(name.length-1).join('*')+name[name.length-1]; }

  db = db || {};
  var defaults = pvDefaultSettings();
  var settings = {};
  Object.keys(defaults).forEach(function(k){ settings[k] = (db.settings && db.settings[k]!==undefined) ? db.settings[k] : defaults[k]; });
  if(!db.settings || Number(db.settings.timeModel||1) < 2){ settings.callOffset = defaults.callOffset; settings.workMinutes = defaults.workMinutes; }
  var target = norm(code);
  if(!target) return {ok:false, error:'접속코드를 입력해주세요'};
  var members = db.members || [];
  var member = null;
  for(var i=0;i<members.length;i++){ if(members[i].active!==false && norm(members[i].code)===target){ member = members[i]; break; } }
  if(!member) return {ok:false, error:'접속코드가 올바르지 않거나 비활성화된 계정입니다'};

  function keyOf(r){ var c=String(r.contractCode||'').trim(); if(c) return 'C:'+c; if(r.clientName && r.weddingDate) return 'N:'+String(r.clientName).trim()+'|'+String(r.weddingDate).trim(); return 'ID:'+r.id; }
  var byId = {}, byKey = {};
  (records||[]).forEach(function(r){ if(r && r.id){ byId[r.id] = r; if(r.type==='contract') byKey[keyOf(r)] = r; } });
  var memberById = {};
  members.forEach(function(m){ memberById[m.id] = m; });

  var events = [];
  var assignments = db.assignments || {};
  var manager = !!member.allView;   // 전체 일정 관리자 계정: 배정과 관계없이 모든 예식을 봄 (보기 전용)
  var ids = Object.keys(assignments), cutoff = '';
  if(manager){
    if(todayStr){ var cd = new Date(todayStr+'T00:00:00Z'); cd.setUTCDate(cd.getUTCDate()-60); cutoff = cd.toISOString().slice(0,10); }
    var seenIds = {}, seenK = {};
    ids.forEach(function(x){ seenIds[x] = 1; var ax = assignments[x] || {}, rx = byId[x] || (ax.key ? byKey[ax.key] : null); if(rx) seenK[keyOf(rx)] = 1; });
    (records||[]).forEach(function(r){ if(r && r.id && r.type==='contract' && !seenIds[r.id] && !seenK[keyOf(r)]){ ids.push(r.id); seenIds[r.id] = 1; seenK[keyOf(r)] = 1; } });
  }
  ids.forEach(function(recordId){
    var a = assignments[recordId] || {slots:[]};
    var r = byId[recordId] || (a.key ? byKey[a.key] : null);
    if(!r || r.type!=='contract' || r.cancelled || !r.weddingDate) return;
    if(manager && cutoff && r.weddingDate < cutoff) return;
    var slots = a.slots || [];
    var mine = slots.filter(function(s){ return s.memberId===member.id; });
    if(mine.length===0 && !manager) return;
    var need = slots.length || ((settings.slotsByProduct||{})[r.productType]) || (r.productType==='양측' ? 4 : 2);
    var wt = toMin(r.weddingTime);
    var offset = (a.callOffset!==null && a.callOffset!==undefined && a.callOffset!=='') ? Number(a.callOffset) : Number(settings.callOffset);
    var work = (a.workMinutes!==null && a.workMinutes!==undefined && a.workMinutes!=='') ? Number(a.workMinutes) : Number(settings.workMinutes);
    var resp = ((db.responses||{})[recordId]||{})[member.id] || {};
    var team = slots.filter(function(s){ return s.memberId; }).map(function(s){
      var m = memberById[s.memberId] || {};
      var rs = ((db.responses||{})[recordId]||{})[s.memberId] || {};
      return {name: m.name||'(미정)', title: m.title||'', role: s.role||'', color: m.color||'#7A2E3A', confirmed: !!rs.confirmed || !!s.pinned, owner: m.kind==='owner' || m.title==='대표',
              phone: (settings.showTeamPhone && s.memberId!==member.id) ? (m.phone||'') : '',
              me: s.memberId===member.id, checkinAt: rs.checkinAt || ''};
    });
    var pay = mine.reduce(function(sum,s){ return sum + (Number(s.pay)||0) + (Number(s.allowance)||0); }, 0);
    var payDetail = mine.map(function(s){ return {role: s.role||'', base: Number(s.pay)||0, allowance: Number(s.allowance)||0, allowanceNote: s.allowanceNote||''}; });
    events.push({
      recordId: recordId,
      date: r.weddingDate,
      weddingTime: r.weddingTime || '',
      callTime: wt===null ? '' : toHm(wt-offset),
      endTime: wt===null ? '' : toHm(wt-offset+work),
      minutes: wt===null ? 0 : work,
      venueName: r.venueName||'', hallName: r.hallName||'', region: r.region||'',
      productType: r.productType||'',
      clientName: settings.showClientName ? (r.clientName||'') : mask(r.clientName),
      clientPhone: (db.settings && db.settings.showClientPhone===true) ? (r.phone||'') : '',
      groomGuests: Number(r.groomGuests)||0, brideGuests: Number(r.brideGuests)||0,
      settingsSubmitted: !!r.settingsSubmitted || !!((db.referralPay||{})['sfdone:'+r.id]),
      roles: mine.map(function(s){ return s.role||''; }),
      pay: pay,
      payDetail: payDetail,
      paid: mine.every(function(s){ return !!s.paid; }),
      team: team,
      note: a.note || '',
      pinned: mine.some(function(s){ return !!s.pinned; }),
      need: Number(need)||0, open: Math.max(0, (Number(need)||0) - slots.filter(function(s){ return s.memberId; }).length),
      slots: manager ? slots.map(function(s){ var rs0 = ((db.responses||{})[recordId]||{})[s.memberId] || {}; return {id: s.id||'', pos: Number(s.pos)||0, role: s.role||'', memberId: s.memberId||'', confirmed: !!(s.memberId && (rs0.confirmed || s.pinned)), paid: !!s.paid}; }) : undefined,
      respondBy: (function(){ if(resp.confirmed) return ''; var sl = mine.filter(function(s){ return s.auto && !s.pinned && s.assignedAt; })[0]; return sl ? responseDeadline(db.settings, r, sl) : ''; })(),
      confirmed: !!resp.confirmed || mine.some(function(s){ return !!s.pinned; }), confirmedAt: resp.confirmedAt || '',
      arrange: (function(){ var a = (db.referralPay||{})['arrange:'+recordId]; return (a && (a.groom || a.bride)) ? {groom: String(a.groom||''), bride: String(a.bride||'')} : null; })(),
      info: (function(){
        var g = (db.referralPay||{})['guide:'+recordId] || {}, c = (db.referralPay||{})['card:'+recordId] || {};
        if(!g.items && !g.groomName && !g.brideName && !(c.rows||[]).length) return null;
        var ct = partnerContacts(c.rows||[]);
        var cardMap = {}; (c.rows||[]).forEach(function(r){ if(r && r.key) cardMap[r.key] = r.value; });
        return {groomName: g.groomName||'', brideName: g.brideName||'', items: g.items||{}, notes: g.notes||{}, rows: ct.rest, contacts: ct.groups, card: cardMap};
      })(),
      checkinAt: resp.checkinAt || '',
      checks: resp.checks || {},
      reports: (resp.reports || []).slice(-30),
      myPos: mine.map(function(s){ return Number(s.pos)||0; }),
      _k: keyOf(r), _own: recordId===r.id, _filled: slots.filter(function(s){ return s.memberId; }).length, _upd: String(a.updatedAt||'')
    });
  });
  // 같은 계약이 두 번 나오지 않게: 계약별로 1건만 (현재 계약 id의 배정 → 배정 인원이 많은 쪽 → 최근 수정한 쪽)
  var bestK = {};
  events.forEach(function(ev, i){
    var b = bestK[ev._k]; if(b===undefined){ bestK[ev._k] = i; return; }
    var p = events[b];
    var better = (ev._own && !p._own) || (ev._own===p._own && (ev._filled > p._filled || (ev._filled===p._filled && ev._upd > p._upd)));
    if(better) bestK[ev._k] = i;
  });
  events = events.filter(function(ev, i){ return bestK[ev._k]===i; });
  events.forEach(function(ev){ delete ev._k; delete ev._own; delete ev._filled; delete ev._upd; });
  events.sort(function(x,y){ return (x.date+' '+(x.callTime||'99:99')).localeCompare(y.date+' '+(y.callTime||'99:99')); });

  var notices = (db.notices||[]).slice().sort(function(x,y){
    if(!!y.pinned !== !!x.pinned) return y.pinned ? 1 : -1;
    return String(y.createdAt||'').localeCompare(String(x.createdAt||''));
  });

  // 대표 계정: 본인 일정과 별도로 전체 일정(미배정 포함)을 함께 보냄 → 파트너스오피스 맨 끝 「전체 일정」 메뉴
  var allEvents = null;
  if(!member.allView && (member.kind==='owner' || member.title==='대표')){

function guideNormalize(input){
  var FIELDS = [
    ['parking','주차 정산',['주차정산','주차','주차안내','주차등록','주차권']],

    ['banquet','연회장 위치',['info_hall','연회장위치','연회장','식당위치','식당','피로연장','식사장소']],
    ['bridalRoom','신부대기실 위치',['info_bride_room','신부대기실','신부대기실위치','신부대기실안내','대기실']],
    ['mealTime','식사 가능 시간',['info_meal_time','식사가능시간','식사시간','식사가능','식사안내']],

  ];
  var key = function(x){ return String(x||'').toLowerCase().replace(/[\s·\-_:()]/g,''); };
  var clean = function(v){
    if(v && typeof v==='object'){ var fl = function(x, d){ if(x===undefined||x===null||d>4) return ''; if(Array.isArray(x)) return x.map(function(y){ return fl(y,d+1); }).filter(Boolean).join(', '); if(typeof x==='object') return Object.keys(x).map(function(q){ return fl(x[q],d+1); }).filter(Boolean).join(' '); return String(x); }; v = fl(v, 0); }
    v = String(v===undefined||v===null ? '' : v).replace(/\r/g,'').trim();
    v = v.replace(/01[016789][\s.\-]?\d{3,4}[\s.\-]?\d{4}/g, '')          // 휴대폰 번호
         .replace(/\d{2,6}[\s\-]\d{2,6}[\s\-]\d{2,8}([\s\-]\d{1,6})?/g, '')   // 계좌번호 형식
         .replace(/\d{10,}/g, '')                                         // 긴 숫자열

  input = input || {};

  var flat = {};
  Object.keys(src).forEach(function(k){ flat[key(k)] = src[k]; });
  // 운영설정서 원본 데이터(MW-DATA): 주차 = 등록 방법(줄마다) + '무료주차 시간'
  if(src.parking===undefined && (src.info_parking_way || src.info_parking_time)){
    var pw = String(src.info_parking_way||'').trim(), pt = String(src.info_parking_time||'').trim();
    flat[key('주차 정산')] = [pw, pt].filter(function(x){ return x; }).join('\n');
  }
  var items = {};
  FIELDS.forEach(function(f){
    var v = src[f[0]];
    if(v===undefined){ var c = [f[1]].concat(f[2]); for(var i=0;i<c.length && v===undefined;i++){ if(flat[key(c[i])]!==undefined) v = flat[key(c[i])]; } }
    v = clean(v); if(v) items[f[0]] = v;
  });
  // 이름이 달라도 찾기: 항목 이름(키 · 라벨)에 핵심 단어가 들어 있으면 자동 매칭 (값이 목록 · 표여도 글로 펼침)
  var FUZZ = {parking:/주차|parking/i, atm:/atm|현금인출|인출기/i, banquet:/연회|식당|피로연|banquet|buffet|hall(?!_?name)/i,
    bridalRoom:/대기실|bride_?room|bridal/i, mealTime:/식사.{0,6}(시간|가능)|meal/i, childTicket:/소인|어린이|child/i};
  var txt = function(v, d){
    d = d||0; if(v===undefined || v===null || d>4) return '';
    if(Array.isArray(v)) return v.map(function(x){ return txt(x, d+1); }).filter(function(x){ return x; }).join(', ');
    if(typeof v==='object') return Object.keys(v).map(function(k2){ return txt(v[k2], d+1); }).filter(function(x){ return x; }).join(' ');
    return String(v).replace(/\r/g,'').trim();
  };
  FIELDS.forEach(function(f){
    if(items[f[0]]) return;
    var parts = [];
    Object.keys(src).forEach(function(k){
      if(/^(guide|groom|bride|note|pdf|signature|image)/i.test(k) || /name|이름|성함|phone|연락|tel/i.test(k)) return;
      if(FUZZ[f[0]].test(k) || FUZZ[f[0]].test(String(k).replace(/_/g,' '))){ var t = clean(txt(src[k])); if(t && parts.indexOf(t)<0) parts.push(t); }
    });
    var v2 = parts.join('\n').slice(0,120); if(v2) items[f[0]] = v2;
  });
  // 새 운영설정서: 「07 하객 안내사항」 칸을 그대로 옮김 (추측 매칭 없이 항목별로 정확히)
  if(['info_parking_way','info_parking_time','info_atm','info_hall','info_bride_room','info_meal_time','info_child_ticket'].some(function(k){ return src[k]!==undefined; })){
    var sv = function(k){ return String(src[k]==null ? '' : src[k]).replace(/\r/g,'').replace(/01[016789][\s.\-]?\d{3,4}[\s.\-]?\d{4}/g,'').replace(/[ \t]{2,}/g,' ').trim().slice(0, 300); };
    items = {};

    var ct = sv('info_child_ticket') || sv('child_ticket_age'); if(ct) items.childTicket = ct;
  }
  var nm = function(x){ return String(x||'').replace(/[^가-힣a-zA-Z\s]/g,'').trim().slice(0,20); };
  var pick = function(keys){ for(var i=0;i<keys.length;i++){ if(input[keys[i]]!==undefined && input[keys[i]]!==null && input[keys[i]]!=='') return input[keys[i]]; var f2 = flat[key(keys[i])]; if(f2!==undefined && f2!=='') return f2; } return ''; };

/* =========================================================
   추천 자동배정 (거주지 기준 근거리 순)
   · member.home = {addr, lat, lng}  · assignment.venuePos = {lat, lng}
   · 제외: 비활성 · 휴무(종일/오전/오후) · 같은 날 시간 겹침 · 이 예식에서 진행불가한 인원 · 이미 배정된 인원

function autoFillSlots(db, records, rec, a, nowIso){

/* =========================================================

    (a.slots||[]).forEach(function(slot){

    return h;
  }

  function quizHTML(p, Q){
    const ans = partQ[p] || {}, nQ = Q.length, nAns = Object.keys(ans).length, nOk = Q.filter((q,i)=> ans[i]===q[2]).length;
    return `<div class="mp-quiz"><div class="mp-quiz-h">✏️ ${p==='E'?'돌발상황':p==='O'?'운영 순서':p+'파트'} 확인 퀴즈 <small>${nAns}/${nQ} · 정답 ${nOk}개</small></div>${Q.map((q,i)=>{ const a = ans[i]; return `<div class="mp-q ${a===undefined?'':(a===q[2]?'ok':'bad')}"><b>Q${i+1}. ${e(q[0])}</b>
        <div class="mp-opts">${q[1].map((_,k)=> (k + i*2 + 1) % q[1].length).map(j=> [q[1][j], j]).map(([o,j])=>`<button class="${a===undefined?'':(j===q[2]?'right':(j===a?'wrong':''))}" data-pp="partQuiz" data-v="${p}:${i}:${j}" ${a!==undefined?'disabled':''}>${e(o)}</button>`).join('')}</div>
        ${a!==undefined? `<p>${a===q[2]?'✅ 정답!':'❌ 다시 확인해요.'} ${e(q[3])}</p>`:''}</div>`; }).join('')}
      ${nAns===nQ? `<div class="mp-res ${nOk===nQ?'ok':''}">${nOk===nQ? `🎉 완벽해요! 익힘 완료로 기록했어요.` : `${nQ-nOk}문제를 다시 확인해 보세요.`} <button data-pp="partRetry" data-v="${p}">다시 풀기</button></div>`:''}</div>`;
  }
  function emgHTML(){
    const done = partRec().E;
    return `<div class="pp-h">🚨 축의대 돌발상황 대응 안내${done? ' <small style="color:var(--pp-sage);font-weight:800;">✓ 익힘 완료</small>':''}</div>
      <div class="em-card">
        <div class="em-top"><b>예기치 못한 상황에도 당황하지 마세요.</b><small>모먼트웍스가 준비한 매뉴얼대로 안전하게 대응해요.</small></div>
        <div class="em-warn"><img src="${EMG_IMG.shield}" alt=""><div><b>※ 사기 수법 주의</b><small>항상 신중하게 확인하고, 원칙에 따라 대응합니다.</small></div></div>
        ${EMG.rows.map((r,i)=>`<div class="em-row">
          <div class="em-s"><img src="${EMG_IMG[i+'s']}" alt=""><div><span>상황</span><b>${e(r[0])}</b></div></div>
          <div class="em-arrow">↓</div>
          <div class="em-r"><img src="${EMG_IMG[i+'r']}" alt=""><div><span>대응</span><b>${e(r[1])}</b>${r[2]? `<small>${e(r[2])}</small>`:''}${r[3]? `<em>${e(r[3])}</em>`:''}${i===3? `<i class="em-star">☆ 원칙 준수가 신랑신부님의 소중한 마음을 지킵니다.</i>`:''}</div></div></div>`).join('')}
        <div class="em-foot">💡 모든 상황은 매뉴얼에 따라 침착하게 대응하고, <b>의심되는 경우 즉시 신랑신부님께 보고</b>합니다.</div>

      ${quizHTML('E', EMG.quiz)}`;

  function sheetHTML(){
    if(!sheet) return '';
    const ev = eventById(sheet.rid);
    if(sheet.mode==='reports'){
      const rs = msgs().filter(m=> m.kind==='report' || m.id==='m_mid'); if(!rs.some(m=> m.id==='m_ticketcount') && msgById('m_ticketcount')) rs.splice(1, 0, msgById('m_ticketcount'));
      return `<div class="pw-sheet-bg" data-pp="sheetClose"></div><div class="pw-sheet"><div class="pw-sheet-h"><b>🚨 특이사항 보고</b><button data-pp="sheetClose">✕</button></div>
        <p class="pw-sheet-sub">상황을 고르면 양식이 채워져요. 빈칸만 채워서 카카오톡 톡방에 바로 공유하세요.</p>
        <div class="pw-rgrid">${rs.map(m=>`<button data-pp="compose" data-v="${e(m.id)}"><b>${e(m.label)}</b><small>카톡으로 공유</small></button>`).join('')}</div></div>`;
    }
    if(sheet.mode==='photo'){
      const st = wf().find(x=> x.id===sheet.step);
      const thumbs = photoFiles.map((f,i)=>`<div class="pw-thumb"><img src="${URL.createObjectURL(f)}" alt=""><button data-pp="photoDel" data-v="${i}">✕</button></div>`).join('');
      return `<div class="pw-sheet-bg" data-pp="sheetClose"></div><div class="pw-sheet"><div class="pw-sheet-h"><b>📷 ${e(st ? st.title : '사진 공유')}</b><button data-pp="sheetClose">✕</button></div>
        <div class="pw-photo-acts">
          <button class="pw-cam" data-pp="camOpen">📸 연속 촬영<small>셔터를 누를 때마다 계속 찍혀요</small></button>
          <label class="pw-cam alt">🖼 앨범에서 업로드<small>미리 찍은 사진 여러 장 선택</small><input type="file" accept="image/*" multiple data-ppfile="album"></label>
        </div>
        <label class="pw-cam-native">휴대폰 기본 카메라로 1장씩 찍기<input type="file" accept="image/*" capture="environment" data-ppfile="cam" id="pwNativeCam"></label>
        ${photoFiles.length? `<div class="pw-thumbs-h">사진 <b>${photoFiles.length}</b>장 · 최대 ${PHOTO_MAX}장 <button data-pp="photoClear">모두 지우기</button></div><div class="pw-thumbs">${thumbs}</div>` : '<div class="pp-empty" style="padding:14px;">촬영하거나 앨범에서 고른 사진이 여기에 모여요 · 여러 장을 한 번에 공유할 수 있어요</div>'}
        <textarea id="pwMsg" rows="2">${e(sheet.text)}</textarea>
        <button class="pw-kakao-btn" data-pp="sharePhotos" ${photoFiles.length?'':'disabled'}>카카오톡으로 사진 ${photoFiles.length? photoFiles.length+'장 ':''}공유하기</button>
        <p class="pw-sheet-sub">공유하기 창에서 <b>카카오톡 → 보고할 개인 톡방</b>을 선택하세요. 공유가 끝나면 사진은 이 화면에서 지워져요 (휴대폰 앨범에는 촬영 앱 설정에 따라 저장돼요).</p></div>`;
    }
    if(sheet.mode==='paypin') return payPinSheetHTML();
    if(sheet.mode==='close') return closeSheetHTML();
    if(sheet.mode==='tickets') return ticketSheetHTML();
    if(sheet.mode==='shots') return shotsSheetHTML();
    const m = msgById(sheet.mid); if(!m || !ev) return '';
    const fields = Array.isArray(m.fields) ? m.fields : [];
    return `<div class="pw-sheet-bg" data-pp="sheetClose"></div><div class="pw-sheet"><div class="pw-sheet-h"><b>💬 ${e(m.label)}</b><button data-pp="sheetClose">✕</button></div>
      ${fields.length? `<div class="pw-fields">${fields.map(f=>`<label><span>${e(f.label)}</span><input type="number" inputmode="numeric" min="0" data-ppfield="${e(f.key)}" value="${e((sheet.vals||{})[f.key]||'')}" placeholder="00"><em>매</em></label>`).join('')}</div>`:''}

  function isDenomEv(ev){ const c = (ev && ev.info && ev.info.card) || {}; return /권종/.test(String(c.money_op || '')); }
  async function closeLoad(){
    if(!sheet || sheet.mode!=='close') return;
    const rid = sheet.rid;
    if(practice && rid===practice.ev.recordId){ sheet.steps = practiceStats(); sheet.loading = false; render(); return; }
    if(!H.onCloseStats){ sheet.err = '미리보기에서는 집계를 불러오지 않아요'; render(); return; }
    sheet.loading = true; sheet.err = ''; render();
    try{ const r = await H.onCloseStats(rid); if(!r || !r.ok) throw new Error((r && r.error) || '집계를 불러오지 못했어요'); if(sheet && sheet.rid===rid){ sheet.steps = r.steps || []; } }
    catch(err){ if(sheet && sheet.rid===rid) sheet.err = err.message || '집계를 불러오지 못했어요'; }
    finally{ if(sheet && sheet.rid===rid){ sheet.loading = false; render(); } }
  }

  const SHOTS = [
    ['wreath','화환','입구 화환을 한 장에 모두 담아요 · 정면에서 리본 글씨가 보이게'],
    ['hall','예식홀 전경','홀 뒤쪽 입구에서 버진로드 · 하객석이 넓게 나오게 가로로'],
    ['table','방명록 · 메시지 테이블','테이블 위 안내판 · 방명록이 보이게 비스듬히 위에서'],
    ['easel','웨딩 액자 · 이젤','액자와 이젤 다리까지 전체가 나오게 세로로'],
    ['desk','축의대 셋팅','축의대 정면에서 책상 · 의자 · 주변이 모두 나오게']
  ];
  /* 사진 단계 공통: 예시를 한 번에 모두 보여주고 · 📷 찍기 / 🖼 앨범에서 한 번에 올리기 → 한 번에 공유 */
  const PHOTO_POOL_MAX = 30;
  function exGallery(list){
    return `<div class="pw-exg">${list.map((x,i)=>`<button class="pw-exg-i" data-pp="shotZoom" data-v="${e(x.k)}" aria-label="${e(x.t)} 예시 크게 보기"><div class="pw-exg-im"><img src="${x.img}" alt="${e(x.t)} 예시"><span>${i+1}</span>${x.n>1? `<em>${x.n}장</em>`:''}</div><b>${e(x.t)}</b><small>${e(x.tip)}</small></button>`).join('')}</div>`;
  }
  function photoPicker(attr, files, delAct){
    return `<div class="pw-pick"><label class="pw-pick-b">📷 찍기<small>카메라로 바로</small><input type="file" accept="image/*" capture="environment" ${attr} hidden></label><label class="pw-pick-b alt">🖼 앨범에서 올리기<small>여러 장 한 번에 선택</small><input type="file" accept="image/*" multiple ${attr} hidden></label></div>
      <button class="pw-cs-re" data-pp="camOpen" style="margin:-4px 0 8px;">📸 앱 안에서 연속 촬영 (셔터를 누를 때마다 계속 찍혀요)</button>
      ${files.length? `<div class="pw-thumbs-h">올린 사진 <b>${files.length}</b>장 <button data-pp="${delAct}" data-v="all">모두 지우기</button></div><div class="pw-thumbs">${files.map((f,i)=>`<div class="pw-thumb"><img src="${URL.createObjectURL(f)}" alt=""><button data-pp="${delAct}" data-v="${i}">✕</button></div>`).join('')}</div>` : '<div class="pp-empty" style="padding:12px;">예시처럼 미리 찍어 두었다면 「앨범에서 올리기」로 한 번에 골라 주세요</div>'}`;
  }
  function addPool(list, fl){ return (list||[]).concat([...(fl||[])].filter(f=> /^image\//.test(f.type||'image/'))).slice(0, PHOTO_POOL_MAX); }
  function shotsAll(){
    const x = eventById(sheet.rid), files = sheet.files || [];
    const text = `[사진 보고] ${x? fdate(x.date)+' '+(x.venueName||'')+' '+(x.clientName||'')+'님 예식' : ''}\n· ${SHOTS.map(s=> s[1]).join(' · ')}` + (files.length? `\n(사진 ${files.length}장)` : '') + (view && view.member && view.member.name ? `\n- ${view.member.name}` : '');
    return {files, ok: files.length>0, text};
  }
  function shotsSheetHTML(){
    const A = shotsAll();
    return `<div class="pw-sheet-bg" data-pp="sheetClose"></div><div class="pw-sheet"><div class="pw-sheet-h"><b>📷 사진 촬영</b><button data-pp="sheetClose">✕</button></div>
      <p class="pw-sheet-sub" style="margin:0 0 8px;">아래 예시 ${SHOTS.length}곳을 <b>같은 구도</b>로 찍어 주세요. 예시를 누르면 크게 보여요. 없는 곳은 건너뛰면 돼요.</p>
      ${exGallery(SHOTS.map(s=> ({k:s[0], t:s[1], tip:s[2], img:SHOT_EX[s[0]], n:1})))}

    if(changed){ try{ localStorage.setItem(cKey(), JSON.stringify(m)); }catch(e){} }

  async function drain(){ // 대기열을 서버에 전송 (화면은 이미 반영된 상태) · 쌓인 요청은 한 번에 묶어서
    if(H.preview || !H.onOp) return;
    let q = qGet();
    while(q.length){
      const canBatch = q.length>1 && H.onOps && view && Number(view.v)>=7;
      const batch = canBatch ? q.slice(0, 50) : [q[0]];
      try{
        if(canBatch){
          const r = await H.onOps(batch);
          q = qGet(); q.splice(0, batch.length); qSet(q);
          const bad = ((r && r.results) || []).filter(x=> x && x.ok===false);
          if(bad.length) await refreshAfterReject(bad[0].error || '일부 항목을 저장하지 못했어요');
        } else {
          const nv = await H.onOp(batch[0]);
          q = qGet(); q.shift(); qSet(q);
          if(nv && Array.isArray(nv.events)){ view = nv; q.forEach(applyLocal); } // 이전 서버는 전체 화면 데이터를 돌려줌
        }
        offlineNoted = false;
      }catch(err){
        if(err && err.network){ if(!offlineNoted){ offlineNoted = true; toast('인터넷이 불안정해 이 기기에 저장했어요. 연결되면 자동으로 보내요'); } break; }
        q = qGet(); q.splice(0, batch.length); qSet(q); // 서버가 거절한 요청은 버리고 서버 상태로 되돌림
        if(batch.some(o=> o.type!=='report')) await refreshAfterReject(err && err.message);
      }
      q = qGet();
    }
    pendingDot(); softRender();
  }

  function welcomeLine(){

      if(te.length>1 && (call===null || nm < call)) ctx.push('multi');
      if(end!==null && nm > end) ctx.push('todayDone');
      else if(call!==null && nm >= call) ctx.push('todayLive');
      else if(call!==null && call - nm <= 120) ctx.push('todaySoon');
      else ctx.push('todayEarly');
    } else {
      if(view.events.some(ev=> ev.date===addDays(t,-1))) ctx.push('yesterday');
      if(view.events.some(ev=> ev.date===addDays(t,1))) ctx.push('tomorrow');
      if(upcoming().some(ev=> !ev.confirmed && !ev.pinned)) ctx.push('pending');
    }
    const ev2 = ctx.length ? ctx : [];
    const tod = h<5?'dawn': h<11?'morning': h<14?'lunch': h<18?'afternoon': h<22?'evening':'night';
    const general = [tod, 'd'+now.getDay(), 'any'];
    if(now.getDate()<=3) general.push('monthStart');
    if(!upcoming().length) general.push('empty');
    const keys = ev2.length ? ev2 : general;
    const pool = WELCOME.filter(w=> keys.includes(w.k));
    // 같은 시간대 안에서는 같은 문구 (새로고침해도 깜빡이지 않게) · 시간대가 바뀌면 다른 문구
    const seed = String(view.member.id)+t+Math.floor(h/3)+keys.join(',');

  /* ---------- 추천 동선: 같은 날 2건 이상 배정된 경우 ---------- */
  const ROUTE_BUFFER = 10; // 다음 예식 출근 전 확보할 여유(분)
  let routeData = null, routeSig = '', routeLoading = false, routeErr = '', routeMonths = 1;
  const hm2m = s => { const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m ? (+m[1])*60+(+m[2]) : null; };
  const m2hm = n => { n=((n%1440)+1440)%1440; return pd(Math.floor(n/60))+':'+pd(n%60); };
  const durTxt = n => n>=60 ? `${Math.floor(n/60)}시간${n%60? ' '+(n%60)+'분':''}` : `${n}분`;
  function routeUntil(){ return addDays(today(), routeMonths*31 - 1); }

    return Object.keys(by).sort().filter(d=>by[d].length>1).map(d=>({date:d, list: by[d].slice().sort((a,b)=> String(a.callTime||a.weddingTime||'').localeCompare(String(b.callTime||b.weddingTime||'')))}));
  }
  function routeDays(){ const u = routeUntil(); return routeDaysAll().filter(d=>d.date<=u); }

  async function loadRoutes(force){
    if(!H.onRoute || routeLoading) return;

    if(!force && routeData && routeSig===sig) return;

      if(!r || !r.ok) throw new Error((r && r.error) || '경로를 불러오지 못했어요');

  function kakaoLink(leg, a, b){

  }
  // 여유 / 빠듯 / 위험 판정 (출발 시각 = 다음 예식 출근 − 이동시간 − 여유 10분)

    const slack = prevEnd===null ? null : leave - prevEnd;

    if(leg && leg.car) modes.push(['car','🚗','자동차',leg.car]);
    return modes;
  }
  // 대중교통 승차 · 하차 · 환승 안내

      const line = x.line ? `<em class="ln">${e(x.line)}${x.kind==='bus' && /^\d/.test(x.line) && !/번/.test(x.line) ? '번':''}</em>` : (x.kind==='subway'?'지하철':'버스');

  // 각 예식에서 업무를 마무리하고 출발해야 하는 시각 (강조 박스)

  const PP_SVG = d=> `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const PP_ICON_REFRESH = PP_SVG('<path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/>');
  const PP_ICON_LOGOUT = PP_SVG('<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/>');
  /* ---------- 새 배정 · 일정 변경 알림 (이 기기에서 아직 못 본 일정) ---------- */
  let NEWMAP = {};
  function sKey(){ return 'pp_seen_'+(view && view.member ? view.member.id : ''); }
  function sGet(){ try{ return JSON.parse(localStorage.getItem(sKey())||'null'); }catch(e){ return null; } }
  function sSet(o){ try{ localStorage.setItem(sKey(), JSON.stringify(o)); }catch(e){} }
  function evSig(ev){ return [ev.date, ev.weddingTime, ev.venueName, ev.hallName, ev.callTime, (ev.roles||[]).join(',')].join('|'); }
  function computeNew(){
    NEWMAP = {};
    if(!view || H.preview) return;

    if(!seen){ const o = {}; up.forEach(ev=>{ o[ev.recordId] = evSig(ev); }); sSet({ev:o, at:new Date().toISOString()}); return; } // 처음 열었을 땐 기존 일정을 본 것으로 처리
    up.forEach(ev=>{ const s = seen.ev && seen.ev[ev.recordId]; if(s===undefined) NEWMAP[ev.recordId] = 'new'; else if(s!==evSig(ev)) NEWMAP[ev.recordId] = 'chg'; });
  }
  function markSeen(){ const o = {}; upcoming().forEach(ev=>{ o[ev.recordId] = evSig(ev); }); const seen = sGet() || {}; const keep = {}; Object.keys(seen.ev||{}).forEach(k=>{ if(!view.events.some(ev=>ev.recordId===k && ev.date>=today())) return; }); sSet({ev:o, at:new Date().toISOString()}); NEWMAP = {}; }

  async function runOp(op, okMsg){
    if(busy) return;

    try{
      const nv = await H.onOp(op);
      if(nv) view = nv;
      if(okMsg) toast(okMsg);
    }catch(err){ toast(err.message || '처리하지 못했어요. 잠시 후 다시 시도해주세요'); }
    finally{ busy=false; render(); }
  }

  async function onClick(ev){

      return;

<script>
