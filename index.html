<style>
html,body{margin:0;padding:0;background:#F7F5F0;}
/* ================= 파트너 포털 (통합관리시스템 내장 + 파트너스오피스 공용) ================= */
.pp{--pp-ink:#241F22;--pp-soft:#5B5650;--pp-paper:#EEF0EA;--pp-card:#FAFAF6;--pp-line:#D9D6C9;--pp-wine:#7A2E3A;--pp-wine-d:#5C1F29;--pp-gold:#A9823C;--pp-gold-s:#EFE3C6;--pp-sage:#4F6F52;--pp-sage-s:#E1EAE0;--pp-coral:#C1553D;--pp-coral-s:#F5DFD8;--pp-slate:#6B7280;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--pp-ink);background:var(--pp-paper);min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:40px;}
.pp *{box-sizing:border-box;}
.pp button{font-family:inherit;}
.pp-preview{background:var(--pp-gold);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;display:flex;justify-content:center;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
.pp-preview button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:12px;}
.pp-top>div:first-child{min-width:0;}
.pp-top{background:linear-gradient(135deg,var(--pp-wine-d),var(--pp-wine) 70%);color:#F5EFE6;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}
.pp-top-inner{max-width:640px;margin:0 auto;}
.pp-brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:11.5px;letter-spacing:.16em;white-space:nowrap;color:var(--pp-gold-s);text-transform:uppercase;}
.pp-who{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px;}
.pp-dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.55);}
.pp-role{font-family:'Pretendard';font-size:11px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 9px;}
.pp-top-actions{display:flex;gap:6px;}
.pp-icon,.pp-ghost{white-space:nowrap;border:1px solid rgba(245,239,230,.4);background:transparent;color:#F5EFE6;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.pp-icon{padding:5px 10px;font-size:14px;line-height:1;}
.pp-tabs{background:var(--pp-wine-d);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:0;z-index:4;scrollbar-width:none;}
.pp-tabs::-webkit-scrollbar{display:none;}
.pp-tabs button{border:none;background:none;color:rgba(245,239,230,.65);font-size:13px;font-weight:700;padding:12px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;position:relative;}
.pp-tabs button.on{color:#F5EFE6;border-bottom-color:var(--pp-gold);}
.pp-tabs .pp-n{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--pp-coral);color:#fff;font-size:10px;line-height:16px;text-align:center;margin-left:4px;padding:0 4px;}
.pp-main{max-width:640px;margin:0 auto;padding:18px 14px 0;}
.pp-h{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;}
.pp-h small{font-family:'Pretendard';font-size:11.5px;color:var(--pp-slate);font-weight:500;}
.pp-hello-t{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;}
.pp-hello-s{font-size:13px;color:var(--pp-soft);margin-top:4px;line-height:1.6;}
.pp-hello-s b{color:var(--pp-wine);}
.pp-alert{margin-top:14px;background:var(--pp-coral-s);color:var(--pp-coral);border:1px solid #EBC3B8;border-radius:10px;padding:11px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.pp-alert button{border:none;background:var(--pp-coral);color:#fff;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.pp-stat{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:10px;padding:11px 12px;}
.pp-stat span{font-size:11px;color:var(--pp-soft);font-weight:600;display:block;}
.pp-stat b{font-family:'Noto Serif KR',serif;font-size:17px;display:block;margin-top:3px;}
.pp-card{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:14px;padding:15px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(36,31,34,.05);position:relative;overflow:hidden;}
.pp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pp-wine);}
.pp-card.today::before{background:var(--pp-gold);}
.pp-card.soon::before{background:var(--pp-coral);}
.pp-card.past{opacity:.72;}
.pp-card.past::before{background:var(--pp-slate);}
.pp-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pp-dday{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:var(--pp-wine);}
.pp-card.today .pp-dday{color:var(--pp-gold);}
.pp-card.soon .pp-dday{color:var(--pp-coral);}
.pp-date{font-weight:700;font-size:13.5px;}
.pp-prod{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--pp-wine);color:#fff;}
.pp-venue{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;margin-top:8px;}
.pp-venue small{font-family:'Pretendard';font-size:12px;color:var(--pp-soft);font-weight:600;margin-left:4px;}
.pp-timeline{display:flex;align-items:center;margin:12px 0 10px;background:#F3F1E9;border-radius:10px;padding:9px 10px;}
.pp-timeline>div{flex:0 0 auto;text-align:center;min-width:64px;}
.pp-timeline>div span{display:block;font-size:10.5px;color:var(--pp-soft);font-weight:600;}
.pp-timeline>div b{font-size:16px;font-weight:700;}
.pp-timeline>div:first-child b{color:var(--pp-wine);}
.pp-timeline i{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--pp-line) 0 5px,transparent 5px 9px);margin:12px 4px 0;}
.pp-meta{display:grid;gap:6px;font-size:12.8px;}
.pp-meta>div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.pp-meta span{width:74px;flex-shrink:0;color:var(--pp-slate);font-size:11.5px;font-weight:600;}
.pp-meta em{font-style:normal;font-weight:700;font-size:11.5px;background:var(--pp-sage-s);color:var(--pp-sage);padding:2px 8px;border-radius:5px;margin-right:4px;}
.pp-meta .ok{color:var(--pp-sage);}
.pp-meta .wait{color:var(--pp-coral);}
.pp-team{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.pp-mate{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pp-line);border-radius:999px;padding:4px 10px 4px 7px;font-size:12px;background:#fff;}
.pp-mate i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.pp-mate a{color:var(--pp-wine);text-decoration:none;font-weight:700;}
.pp-mate.me{border-color:var(--pp-wine);}
.pp-note{margin-top:10px;background:var(--pp-gold-s);border-radius:9px;padding:9px 12px;font-size:12.5px;color:#6B531F;white-space:pre-wrap;line-height:1.6;}
.pp-progress{height:6px;background:#E6E3D8;border-radius:3px;overflow:hidden;margin-top:12px;}
.pp-progress div{height:100%;background:linear-gradient(90deg,var(--pp-wine),var(--pp-gold));}
.pp-progress-l{font-size:11px;color:var(--pp-soft);margin-top:4px;}
.pp-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;}
.pp-btn{border:1px solid var(--pp-line);background:#fff;color:var(--pp-ink);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
.pp-btn:hover{border-color:var(--pp-wine);color:var(--pp-wine);}
.pp-btn.primary{background:var(--pp-wine);border-color:var(--pp-wine);color:#fff;}
.pp-btn.gold{background:var(--pp-gold);border-color:var(--pp-gold);color:#fff;}
.pp-btn:disabled{opacity:.5;cursor:default;}
.pp-confirmed{font-size:12px;font-weight:700;color:var(--pp-sage);background:var(--pp-sage-s);border-radius:8px;padding:8px 11px;}
.pp-empty{text-align:center;color:var(--pp-soft);font-size:13px;padding:34px 10px;background:var(--pp-card);border:1px dashed var(--pp-line);border-radius:12px;}
.pp-cal{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:10px;}
.pp-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pp-cal-head b{font-family:'Noto Serif KR',serif;font-size:15px;}
.pp-cal-head button{border:1px solid var(--pp-line);background:#fff;border-radius:7px;width:32px;height:30px;cursor:pointer;font-size:13px;}
.pp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.pp-cal-wd{text-align:center;font-size:10.5px;font-weight:700;color:var(--pp-soft);padding:3px 0;}
.pp-cal-wd.we{color:var(--pp-wine);}
.pp-day{min-height:50px;border-radius:7px;background:#fff;border:1px solid #ECEAE0;padding:4px;font-size:11px;cursor:pointer;position:relative;text-align:left;color:var(--pp-ink);}
.pp-day.out{visibility:hidden;}
.pp-day.today{border-color:var(--pp-gold);box-shadow:inset 0 0 0 1px var(--pp-gold);}
.pp-day.we .pp-dn{color:var(--pp-wine);}
.pp-day.sel{background:var(--pp-gold-s);}
.pp-day.locked{cursor:not-allowed;background:#F4F3EE;color:#AAA59A;}
.pp-dn{font-weight:700;font-size:11.5px;}
.pp-ev{display:block;margin-top:3px;background:var(--pp-wine);color:#fff;border-radius:4px;font-size:9.5px;font-weight:700;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pp-av{display:block;margin-top:3px;border-radius:4px;font-size:9.5px;font-weight:700;padding:1px 3px;text-align:center;}
.pp-av.off{background:#E4E1D7;color:#6B6558;}
.pp-av.am{background:#E4E7EF;color:#3E5079;}
.pp-av.pm{background:#EFE3C6;color:#8A6A2A;}
.pp-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--pp-soft);margin:10px 2px 0;}
.pp-legend span{display:inline-flex;align-items:center;gap:4px;}
.pp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.pp-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.pp-chip{flex-shrink:0;border:1px solid var(--pp-line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--pp-ink);}
.pp-chip.on{background:var(--pp-wine);border-color:var(--pp-wine);color:#fff;}
.pp-phase{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.pp-phase-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F3F1E9;font-size:12.5px;font-weight:700;}
.pp-phase-h small{font-weight:600;color:var(--pp-soft);}
.pp-phase-h small.late{color:var(--pp-coral);}
.pp-check{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid #EFEDE3;font-size:13.5px;cursor:pointer;line-height:1.5;}
.pp-check input{width:19px;height:19px;accent-color:var(--pp-wine);flex-shrink:0;margin-top:1px;}
.pp-check.done span{color:var(--pp-slate);text-decoration:line-through;}
.pp-list-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid #EFEDE3;font-size:12.8px;}
.pp-list-row:first-child{border-top:none;}
.pp-box{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;overflow:hidden;}
.pp-select{border:1px solid var(--pp-line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;background:#fff;}
.pp-notice{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.pp-notice.pin{border-color:var(--pp-gold);}
.pp-notice h4{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;}
.pp-notice h4 em{font-style:normal;font-size:10.5px;background:var(--pp-gold);color:#fff;border-radius:4px;padding:1px 6px;}
.pp-notice p{margin:8px 0 0;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--pp-soft);}
.pp-notice time{display:block;font-size:11px;color:var(--pp-slate);margin-top:8px;}
.pp-foot{text-align:center;font-size:11px;color:var(--pp-slate);margin-top:26px;}
.pp-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pp-ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.pp-toast.show{opacity:1;}
.pp-busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pp-gold),var(--pp-wine));z-index:700;animation:ppbusy 1s linear infinite;}
@keyframes ppbusy{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
details.pp-past summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--pp-soft);margin:18px 2px 10px;}
@media (max-width:420px){.pp-timeline>div{min-width:54px;} .pp-timeline>div b{font-size:14.5px;} .pp-stat b{font-size:15px;}}

.pp-worknote{font-size:11px;color:var(--pp-slate);line-height:1.6;margin:-4px 0 10px;}

/* ---------- 모먼트웍스 브랜드 테마 (아이보리 · 먹색 · 골드) ---------- */
.pp{--pp-ink:#1A1618;--pp-soft:#6F685E;--pp-paper:#F7F5F0;--pp-card:#FFFFFF;--pp-line:#E5DFD3;--pp-wine:#1A1618;--pp-wine-d:#1A1618;--pp-gold:#A9823C;--pp-gold-s:#F4EDDD;--pp-sage:#4F6F52;--pp-sage-s:#EAF0E9;--pp-coral:#B24A35;--pp-coral-s:#F7E7E2;--pp-slate:#8A8378;}
.pp-top{background:var(--pp-paper);color:var(--pp-ink);border-bottom:1px solid var(--pp-line);padding:18px 18px 16px;align-items:center;}
.pp-brand{color:var(--pp-gold);letter-spacing:.2em;}
.pp-who{color:var(--pp-ink);font-weight:600;}
.pp-dot{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--pp-line);}
.pp-role{background:var(--pp-gold-s);color:#7A5E27;border-radius:2px;}
.pp-icon,.pp-ghost{border:1px solid var(--pp-line);color:var(--pp-ink);background:#fff;border-radius:2px;}
.pp-icon:hover,.pp-ghost:hover{border-color:var(--pp-ink);}
.pp-mark{height:40px;opacity:1;}
.pp-brandrow{gap:14px;}
.pp-brandrow>div{border-left:1px solid var(--pp-line);padding-left:14px;}
.pp-tabs{background:rgba(247,245,240,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--pp-line);}
.pp-tabs button{color:#9A9388;border-bottom:1px solid transparent;margin-bottom:-1px;font-weight:600;letter-spacing:.02em;}
.pp-tabs button.on{color:var(--pp-ink);border-bottom-color:var(--pp-ink);}
.pp-hello-t{font-weight:600;letter-spacing:-.01em;}
.pp-hello-s b{color:var(--pp-ink);border-bottom:1px solid var(--pp-gold);}
.pp-stat,.pp-card,.pp-box,.pp-cal,.pp-phase,.pp-notice,.pp-empty{border-radius:4px;box-shadow:0 1px 2px rgba(26,22,24,.035);border-color:var(--pp-line);}
.pp-stat{border-top:2px solid var(--pp-gold);}
.pp-stat b{font-weight:600;}
.pp-card::before{width:2px;background:var(--pp-ink);}
.pp-card.today::before{background:var(--pp-gold);}
.pp-dday{font-weight:600;color:var(--pp-ink);}
.pp-card.today .pp-dday{color:var(--pp-gold);}
.pp-venue{font-weight:600;}
.pp-prod{background:var(--pp-ink);border-radius:2px;}
.pp-timeline{background:#FBFAF6;border:1px solid #F1EDE5;border-radius:4px;}
.pp-timeline>div:first-child b{color:var(--pp-ink);border-bottom:1px solid var(--pp-gold);}
.pp-meta em{background:#F3F0E8;color:var(--pp-ink);border-radius:2px;}
.pp-mate{border-radius:2px;}
.pp-mate a{color:var(--pp-ink);}
.pp-note{background:#FBF7EE;border:1px solid #EADFC6;border-radius:4px;}
.pp-progress{height:3px;border-radius:0;background:#EFEBE3;}
.pp-progress div{background:linear-gradient(90deg,var(--pp-ink),var(--pp-gold));}
.pp-btn{border-radius:2px;}
.pp-btn:hover{border-color:var(--pp-ink);color:var(--pp-ink);}
.pp-btn.primary{background:var(--pp-ink);border-color:var(--pp-ink);}
.pp-btn.primary:hover{background:#fff;color:var(--pp-ink);}
.pp-confirmed{border-radius:2px;}
.pp-alert{border-radius:4px;}
.pp-alert button{border-radius:2px;}
.pp-chip{border-radius:2px;}
.pp-chip.on{background:var(--pp-ink);border-color:var(--pp-ink);}
.pp-phase-h{background:#FBFAF6;}
.pp-day{border-radius:2px;border-color:#EFEBE3;}
.pp-ev{background:var(--pp-ink);border-radius:2px;}
.pp-cal-head b{font-weight:600;}
.pp-cal-head button{border-radius:2px;border-color:var(--pp-line);}
.pp-select{border-radius:2px;}
.pp-check input{accent-color:var(--pp-ink);}
.pp-notice.pin{border-color:#EADFC6;border-top:2px solid var(--pp-gold);}
.pp-notice h4 em{border-radius:2px;}
.pp-foot{margin-top:40px;letter-spacing:.02em;}
.pp-foot img{height:28px;width:auto;display:block;margin:0 auto 10px;opacity:.8;}
.pp-foot b{display:block;font-size:10px;letter-spacing:.34em;padding-left:.34em;color:var(--pp-soft);font-weight:600;margin-bottom:6px;}
.pp-preview{background:var(--pp-ink);}

/* ---------- 색 대비 강화 (포털) ---------- */
.pp{--pp-paper:#EEE9DF;--pp-line:#D6CDBD;--pp-ink:#171315;--pp-soft:#4E4740;--pp-slate:#766F64;--pp-gold:#A9823C;--pp-coral:#B0432E;--pp-sage:#3D6A45;}
.pp-top{background:#FBF9F4;}
.pp-tabs{background:#1C1719 !important;border-bottom:3px solid var(--pp-gold);}
.pp-tabs button{color:#B8AFA2;border-bottom:none;margin-bottom:0;}
.pp-tabs button.on{color:#1C1719;background:var(--pp-gold);border-bottom:none;font-weight:700;}
.pp-tabs .pp-n{background:#fff;color:var(--pp-coral);}
.pp-h{padding-left:10px;border-left:4px solid var(--pp-gold);}
.pp-stat{border-top:3px solid var(--pp-gold);box-shadow:0 2px 8px rgba(23,19,21,.05);}

.pp-timeline>div b{color:#F7F2E8;}
.pp-timeline>div:first-child b{color:#F2C27A;border-bottom-color:#F2C27A;}
.pp-timeline i{background:repeating-linear-gradient(90deg,#6B625A 0 5px,transparent 5px 9px);}
.pp-worknote{color:var(--pp-slate);}
.pp-meta em{background:var(--pp-ink);color:#fff;}
.pp-prod{background:var(--pp-gold);color:#1C1719;}
.pp-btn{border-color:#B9AE9A;}
.pp-btn:hover{background:var(--pp-ink);color:#fff;border-color:var(--pp-ink);}
.pp-btn.primary{background:var(--pp-ink);}

.pp-alert{background:var(--pp-coral);color:#fff;border:none;}

.pp-phase-h{background:#2A2426;color:#F3EDE2;}

.pp-check:nth-child(odd){background:#FAF7F1;}
.pp-cal-wd{background:#2A2426;color:#F3EDE2;border-radius:2px;}
.pp-cal-wd.we{color:#F2C27A;}
.pp-day{border-color:#E1D9CB;}
.pp-day.today{box-shadow:inset 0 0 0 2px var(--pp-gold);border-color:var(--pp-gold);}
.pp-chip{border-color:#B9AE9A;}
.pp-list-row:nth-child(even){background:#FAF7F1;}
.pp-notice.pin{border-top:3px solid var(--pp-gold);}

/* ===== 오늘 업무 진행 ===== */
.pw-start{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;border:none;border-radius:12px;background:linear-gradient(135deg,var(--pp-wine-d),var(--pp-wine));color:#fff;padding:16px 18px;margin:12px 0 4px;text-align:left;font:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(92,31,41,.25);}
.pw-start span{font-size:12px;color:var(--pp-gold-s);font-weight:600;}
.pw-start b{font-size:17px;}
.pw-learn{width:100%;border:1px dashed var(--pp-gold);background:var(--pp-gold-s);color:var(--pp-ink);border-radius:10px;padding:11px 14px;margin:12px 0 4px;font:inherit;font-size:13px;text-align:left;cursor:pointer;}
.pw-learn b{color:var(--pp-wine);}
.pw-intro{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;}

.pw-head{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;padding:14px 16px;font-size:13px;}

.pw-times{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:12px;color:var(--pp-soft);}

.pw-cur p{font-size:13.5px;line-height:1.7;color:var(--pp-soft);margin:0 0 10px;}
.pw-tag{display:inline-block;font-size:12px;font-weight:700;background:var(--pp-coral-s);color:var(--pp-coral);padding:4px 10px;border-radius:999px;margin-bottom:10px;}
.pw-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pw-done{width:100%;border:none;border-radius:12px;background:var(--pp-sage);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;}

.pw-list{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.pw-step{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--pp-line);cursor:pointer;}
.pw-step:last-child{border-bottom:none;}
.pw-step.cur{background:var(--pp-gold-s);}

.pw-no{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#E8E4D8;color:var(--pp-soft);}

.pw-st{display:flex;flex-direction:column;gap:2px;min-width:0;}

.pw-bar a{background:#fff;color:var(--pp-ink);border:1px solid var(--pp-line);}
.pw-sheet-bg{position:fixed;inset:0;background:rgba(20,16,18,.45);z-index:50;}
.pw-sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--pp-paper);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:51;max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.pw-sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pw-sheet-h b{font-size:16px;}
.pw-sheet-h button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--pp-soft);}
.pw-sheet-sub{font-size:11.5px;color:var(--pp-slate);line-height:1.6;margin:8px 0 0;}
.pw-sheet textarea{width:100%;box-sizing:border-box;border:1px solid var(--pp-line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.6;background:#fff;resize:vertical;}
.pw-recs{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.pw-rec{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--pp-line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;}
.pw-rec small{display:block;font-size:11px;color:var(--pp-slate);font-weight:500;}
.pw-rec input{flex:1;border:1px solid var(--pp-line);border-radius:8px;padding:8px;font:inherit;}
.pw-sheet-acts{display:flex;gap:8px;}
.pw-sheet-acts .pp-btn{flex:1;padding:12px;}
.pw-sheet-acts .primary{background:#FEE500;color:#191600;border-color:#FEE500;}
.pw-rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.pw-rgrid button{border:1px solid var(--pp-line);background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit;cursor:pointer;}
.pw-rgrid b{display:block;font-size:14px;} .pw-rgrid small{font-size:11px;color:var(--pp-slate);}
.pw-kakao-to{display:flex;align-items:center;gap:10px;background:#FEE500;border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.pw-kk{flex:0 0 auto;background:#3C1E1E;color:#FEE500;font-size:10px;font-weight:900;letter-spacing:.04em;border-radius:6px;padding:5px 6px;}
.pw-kakao-to b{display:block;font-size:13.5px;color:#191600;}
.pw-kakao-to small{font-size:11px;color:#4A3F00;}
.pw-kakao-btn{width:100%;margin-top:10px;border:none;border-radius:12px;background:#FEE500;color:#191600;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.pw-kakao-steps{margin:10px 0 0;padding-left:18px;font-size:12px;line-height:1.7;color:var(--pp-soft);}

/* ================= 접속 메인화면 (모먼트웍스 로고) ================= */
.mw-entry{position:fixed;inset:0;z-index:500;overflow-y:auto;background:#F7F5F0;background-image:radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #F7F5F0 55%, #EFEBE3 100%);color:#1A1618;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;padding:56px 22px;box-sizing:border-box;}
.mw-entry::before,.mw-entry::after{content:"";position:fixed;pointer-events:none;}
.mw-entry::before{inset:14px;border:1px solid rgba(26,22,24,.16);}
.mw-entry::after{inset:20px;border:1px solid rgba(169,130,60,.30);}
.mw-entry *{box-sizing:border-box;}
.mw-entry-inner{position:relative;z-index:1;width:100%;max-width:340px;text-align:center;animation:mwFade 1s cubic-bezier(.2,.7,.2,1) both;margin:auto 0;}
.mw-entry-logo{display:block;width:236px;max-width:64vw;height:auto;margin:0 auto;user-select:none;-webkit-user-drag:none;}
.mw-entry-label{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px 0 28px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#7E776C;padding-left:.22em;}
.mw-entry-label::before,.mw-entry-label::after{content:"";width:26px;height:1px;background:#C9B48A;}
.mw-tabs{display:flex;justify-content:center;gap:30px;margin:0 0 28px;}
.mw-tabs button{appearance:none;background:none;border:none;border-bottom:1px solid transparent;padding:0 2px 7px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.14em;color:#A39C90;cursor:pointer;transition:color .2s,border-color .2s;}
.mw-tabs button:hover{color:#1A1618;}
.mw-tabs button.active{color:#1A1618;border-bottom-color:#1A1618;}
.mw-field{text-align:left;margin-bottom:20px;}
.mw-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;color:#8A8378;margin-bottom:4px;}
.mw-field input{width:100%;border:none;border-bottom:1px solid #CFC8BA;border-radius:0;background:transparent;padding:10px 2px;font-family:inherit;font-size:15.5px;color:#1A1618;outline:none;transition:border-color .25s;-webkit-appearance:none;}
.mw-field input:focus{border-bottom-color:#1A1618;}
.mw-field input::placeholder{color:#C2BBAE;}
.mw-field input.code{text-align:center;letter-spacing:.28em;font-weight:600;font-size:19px;text-transform:uppercase;padding-left:.28em;}
.mw-note{font-size:12.5px;line-height:1.8;color:#6F685E;margin:0 0 24px;}
.mw-check{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#6F685E;margin:0 0 14px;cursor:pointer;}
.mw-check input{accent-color:#1A1618;width:14px;height:14px;margin:0;}
.mw-error{color:#A8432F;font-size:12px;line-height:1.55;min-height:18px;margin:2px 0 12px;}
.mw-btn{width:100%;border:1px solid #1A1618;border-radius:0;background:#1A1618;color:#F7F5F0;padding:15px 14px;font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.18em;cursor:pointer;transition:background .25s,color .25s;}
.mw-btn:hover{background:transparent;color:#1A1618;}
.mw-btn:disabled{opacity:.45;cursor:default;}
.mw-link{display:inline-block;background:none;border:none;margin-top:20px;font-family:inherit;font-size:11.5px;letter-spacing:.06em;color:#8A8378;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.mw-foot{margin:44px 0 0;font-size:10px;font-weight:600;letter-spacing:.3em;color:#ADA699;padding-left:.3em;}
.mw-loading{font-size:12px;letter-spacing:.26em;color:#8A8378;margin-top:36px;padding-left:.26em;}
.mw-loading::after{content:"";display:block;width:34px;height:1px;background:#1A1618;margin:16px auto 0;animation:mwLine 1.4s ease-in-out infinite;}
@keyframes mwFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes mwLine{0%,100%{transform:scaleX(.3);opacity:.35;}50%{transform:scaleX(1);opacity:1;}}
@media (max-height:640px){.mw-entry-logo{width:170px;} .mw-entry-label{margin:22px 0 20px;} .mw-foot{margin-top:28px;}}
/* 상단 모노그램 */
.mw-topmark{height:52px;width:auto;display:block;opacity:.95;}
.mw-topwrap{display:flex;align-items:center;gap:18px;}
.mw-topwrap .mw-topdiv{width:1px;align-self:stretch;background:rgba(245,239,230,.28);margin:4px 0;}
.pp-mark{height:34px;width:auto;display:block;opacity:.95;}
.pp-brandrow{display:flex;align-items:center;gap:12px;}
@media (max-width:560px){.mw-topmark{height:40px;} .mw-topwrap{gap:12px;}}

</style>

function buildPartnerView(records, db, code, todayStr){
  function norm(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
  function toMin(s){ var m=/^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m ? (+m[1])*60+(+m[2]) : null; }
  function toHm(n){ if(n===null||n===undefined) return ''; n=((n%1440)+1440)%1440; var h=Math.floor(n/60), mi=n%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
  function mask(name){ name=String(name||''); if(name.length<2) return name; if(name.length===2) return name[0]+'*'; return name[0]+new Array(name.length-1).join('*')+name[name.length-1]; }

  db = db || {};
  var defaults = pvDefaultSettings();
  var settings = {};
  Object.keys(defaults).forEach(function(k){ settings[k] = (db.settings && db.settings[k]!==undefined) ? db.settings[k] : defaults[k]; });
  if(!db.settings || Number(db.settings.timeModel||1) < 2){ settings.callOffset = defaults.callOffset; settings.workMinutes = defaults.workMinutes; }
  var target = norm(code);
  if(!target) return {ok:false, error:'접속코드를 입력해주세요'};
  var members = db.members || [];
  var member = null;
  for(var i=0;i<members.length;i++){ if(members[i].active!==false && norm(members[i].code)===target){ member = members[i]; break; } }
  if(!member) return {ok:false, error:'접속코드가 올바르지 않거나 비활성화된 계정입니다'};

  function keyOf(r){ var c=String(r.contractCode||'').trim(); if(c) return 'C:'+c; if(r.clientName && r.weddingDate) return 'N:'+String(r.clientName).trim()+'|'+String(r.weddingDate).trim(); return 'ID:'+r.id; }
  var byId = {}, byKey = {};
  (records||[]).forEach(function(r){ if(r && r.id){ byId[r.id] = r; if(r.type==='contract') byKey[keyOf(r)] = r; } });
  var memberById = {};
  members.forEach(function(m){ memberById[m.id] = m; });

  var events = [];
  var assignments = db.assignments || {};
  Object.keys(assignments).forEach(function(recordId){
    var a = assignments[recordId] || {};
    var r = byId[recordId] || (a.key ? byKey[a.key] : null);
    if(!r || r.type!=='contract' || r.cancelled || !r.weddingDate) return;
    var slots = a.slots || [];
    var mine = slots.filter(function(s){ return s.memberId===member.id; });
    if(mine.length===0) return;
    var wt = toMin(r.weddingTime);
    var offset = (a.callOffset!==null && a.callOffset!==undefined && a.callOffset!=='') ? Number(a.callOffset) : Number(settings.callOffset);
    var work = (a.workMinutes!==null && a.workMinutes!==undefined && a.workMinutes!=='') ? Number(a.workMinutes) : Number(settings.workMinutes);
    var resp = ((db.responses||{})[recordId]||{})[member.id] || {};
    var team = slots.filter(function(s){ return s.memberId; }).map(function(s){
      var m = memberById[s.memberId] || {};
      return {name: m.name||'(미정)', title: m.title||'', role: s.role||'', color: m.color||'#7A2E3A',
              phone: (settings.showTeamPhone && s.memberId!==member.id) ? (m.phone||'') : '',
              me: s.memberId===member.id};
    });
    var pay = mine.reduce(function(sum,s){ return sum + (Number(s.pay)||0) + (Number(s.allowance)||0); }, 0);
    var payDetail = mine.map(function(s){ return {role: s.role||'', base: Number(s.pay)||0, allowance: Number(s.allowance)||0, allowanceNote: s.allowanceNote||''}; });
    events.push({
      recordId: recordId,
      date: r.weddingDate,
      weddingTime: r.weddingTime || '',
      callTime: wt===null ? '' : toHm(wt-offset),
      endTime: wt===null ? '' : toHm(wt-offset+work),
      minutes: wt===null ? 0 : work,
      venueName: r.venueName||'', hallName: r.hallName||'', region: r.region||'',
      productType: r.productType||'',
      clientName: settings.showClientName ? (r.clientName||'') : mask(r.clientName),
      clientPhone: (db.settings && db.settings.showClientPhone===true) ? (r.phone||'') : '',
      groomGuests: Number(r.groomGuests)||0, brideGuests: Number(r.brideGuests)||0,
      settingsSubmitted: !!r.settingsSubmitted,
      roles: mine.map(function(s){ return s.role||''; }),
      pay: pay,
      payDetail: payDetail,
      paid: mine.every(function(s){ return !!s.paid; }),
      team: team,
      note: a.note || '',
      confirmed: !!resp.confirmed, confirmedAt: resp.confirmedAt || '',
      checkinAt: resp.checkinAt || '',
      checks: resp.checks || {},
      reports: (resp.reports || []).slice(-30),
      myPos: mine.map(function(s){ return Number(s.pos)||0; })
    });
  });
  events.sort(function(x,y){ return (x.date+' '+(x.callTime||'99:99')).localeCompare(y.date+' '+(y.callTime||'99:99')); });

  var notices = (db.notices||[]).slice().sort(function(x,y){
    if(!!y.pinned !== !!x.pinned) return y.pinned ? 1 : -1;
    return String(y.createdAt||'').localeCompare(String(x.createdAt||''));
  });

  return {
    ok: true,
    today: todayStr || '',
    member: {id: member.id, name: member.name, title: member.title||'', color: member.color||'#7A2E3A', kind: member.kind||'partner'},
    events: events,
    notices: notices,
    template: db.template || [],
    workflow: (db.settings && Array.isArray(db.settings.workflow) && db.settings.workflow.length) ? db.settings.workflow : pvDefaultWorkflow(),
    messages: (db.settings && Array.isArray(db.settings.msgTemplates) && db.settings.msgTemplates.length) ? db.settings.msgTemplates : pvDefaultMessages(),
    owners: members.filter(function(m){ return m.active!==false && (m.kind==='owner' || m.title==='대표'); }).map(function(m){ return {name: m.name, phone: m.phone||''}; }),
    reportPhone: (db.settings && db.settings.reportPhone) || '',
    kakaoUrl: (db.settings && db.settings.kakaoChannelUrl) || 'https://pf.kakao.com/_FbIfX/chat',
    availability: (db.availability||{})[member.id] || {},
    settings: {minWage: settings.minWage, availabilityLockDays: settings.availabilityLockDays, workMinutes: settings.workMinutes, callOffset: settings.callOffset},
    generatedAt: new Date().toISOString()
  };
}

function applyPartnerUpdate(db, records, code, op, todayStr){
  function norm(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
  db = db || {};
  var member = (db.members||[]).filter(function(m){ return m.active!==false && norm(m.code)===norm(code) && norm(code); })[0];
  if(!member) return {ok:false, error:'접속코드가 올바르지 않습니다'};
  op = op || {};
  var now = new Date().toISOString();
  if(op.type==='confirm' || op.type==='check' || op.type==='checkin'){
    var a = (db.assignments||{})[op.recordId];
    var assigned = a && (a.slots||[]).some(function(s){ return s.memberId===member.id; });
    if(!assigned) return {ok:false, error:'배정되지 않은 예식입니다'};
    db.responses = db.responses || {};
    db.responses[op.recordId] = db.responses[op.recordId] || {};
    var resp = db.responses[op.recordId][member.id] = db.responses[op.recordId][member.id] || {};
    if(op.type==='confirm'){ resp.confirmed = op.value!==false; resp.confirmedAt = resp.confirmed ? now : ''; }
    if(op.type==='check'){
      resp.checks = resp.checks || {};
      if(op.value){ resp.checks[op.itemId] = now; } else { delete resp.checks[op.itemId]; }
    }
    if(op.type==='checkin'){ resp.checkinAt = now; }
    resp.updatedAt = now;
    return {ok:true, db:db};
  }
  if(op.type==='report'){ // 파트너가 보낸 보고 기록 (대표 화면 활동 피드에 표시)
    var ra = (db.assignments||{})[op.recordId];
    var ras = ra && (ra.slots||[]).some(function(s){ return s.memberId===member.id; });
    if(!ras) return {ok:false, error:'배정되지 않은 예식입니다'};
    db.responses = db.responses || {};
    db.responses[op.recordId] = db.responses[op.recordId] || {};
    var rr = db.responses[op.recordId][member.id] = db.responses[op.recordId][member.id] || {};
    rr.reports = (rr.reports || []).concat([{at: now, label: String(op.label||'').slice(0,40), to: String(op.to||'').slice(0,10), text: String(op.text||'').slice(0,600)}]).slice(-30);
    rr.updatedAt = now;
    return {ok:true, db:db};
  }
  if(op.type==='availability'){
    var date = String(op.date||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return {ok:false, error:'날짜 형식이 올바르지 않습니다'};
    if(todayStr && date < todayStr) return {ok:false, error:'지난 날짜는 변경할 수 없습니다'};
    var lockDays = (db.settings && db.settings.availabilityLockDays!==undefined) ? Number(db.settings.availabilityLockDays) : pvDefaultSettings().availabilityLockDays;
    if(todayStr && lockDays>0){
      var t = new Date(todayStr+'T00:00:00Z').getTime(), d = new Date(date+'T00:00:00Z').getTime();
      if((d-t)/86400000 < lockDays) return {ok:false, error:'예식 '+lockDays+'일 이내 날짜는 대표에게 직접 연락해주세요'};
    }
    db.availability = db.availability || {};
    var mine = db.availability[member.id] = db.availability[member.id] || {};
    if(!op.value){ delete mine[date]; }
    else if(['off','am','pm'].indexOf(op.value)>=0){ mine[date] = {type: op.value, note: String(op.note||'').slice(0,100), by:'partner', at: now}; }
    else return {ok:false, error:'알 수 없는 휴무 유형입니다'};
    return {ok:true, db:db};
  }
  return {ok:false, error:'알 수 없는 요청입니다'};
}

  const WD = ['일','월','화','수','목','금','토'];

  /* ---------- 캘린더(.ics) ---------- */
  function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function buildIcs(evs){
    const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MomentWorks//PartnersOffice//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:모먼트웍스 근무','X-WR-TIMEZONE:Asia/Seoul'];
    evs.forEach(ev=>{
      const st=(ev.callTime||ev.weddingTime||'09:00'), en=(ev.endTime||st);
      const dt=(d,t)=> d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
      const endDate = en<st ? addDays(ev.date,1) : ev.date;
      L.push('BEGIN:VEVENT','UID:'+ev.recordId+'@momentworks.partners','DTSTAMP:'+stamp,
        'DTSTART;TZID=Asia/Seoul:'+dt(ev.date,st),'DTEND;TZID=Asia/Seoul:'+dt(endDate,en),
        'SUMMARY:'+icsEsc('[모먼트웍스] '+ev.venueName+' 축의대'),
        'LOCATION:'+icsEsc((ev.venueName+' '+ev.hallName).trim()),
        'DESCRIPTION:'+icsEsc('출근 '+ev.callTime+' / 예식 '+ev.weddingTime+' / 근무 종료(예상) '+ev.endTime+'\n※ '+workNote()+(ev.note? '\n전달사항: '+ev.note:'')),
        'BEGIN:VALARM','TRIGGER:-PT12H','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('내일 축의대 근무가 있어요'),'END:VALARM','END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function downloadIcs(evs, name){

    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name||'momentworks.ics';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  }

    const {ev} = workEvent(); const rid = (sheet && sheet.rid) || (ev && ev.recordId); const x = eventById(rid);
    const m = msgById(mid); if(!m || !x){ toast('예식 정보를 찾지 못했어요'); return; }
    sheet = {mode:'compose', rid, mid, text: fillMsg(m.body, x), ticket: ''};

  function logReport(rid, m, text){ if(H.preview) return; queueOp({type:'report', recordId:rid, label:m.label, to:m.to, text}); }

  /* ---------- 끊김 대비: 실패한 체크·보고는 기기에 보관했다가 다시 전송 ---------- */
  function qKey(){ return 'pp_queue_'+(view && view.member ? view.member.id : ''); }
  function qGet(){ try{ return JSON.parse(localStorage.getItem(qKey())||'[]'); }catch(e){ return []; } }
  function qSet(a){ try{ localStorage.setItem(qKey(), JSON.stringify(a)); }catch(e){} }
  function applyLocal(op){
    const x = eventById(op.recordId); if(!x) return;
    if(op.type==='check'){ x.checks = x.checks||{}; if(op.value) x.checks[op.itemId] = new Date().toISOString(); else delete x.checks[op.itemId]; }
    if(op.type==='checkin' && !x.checkinAt) x.checkinAt = new Date().toISOString();
    if(op.type==='report'){ x.reports = (x.reports||[]).concat([{at:new Date().toISOString(), label:op.label, text:op.text}]); }
  }
  async function flushQueue(){
    if(H.preview || !H.onOp) return;
    let q = qGet(); if(!q.length) return;
    while(q.length){ try{ const nv = await H.onOp(q[0]); if(nv) view = nv; q.shift(); qSet(q); }catch(e){ if(e && e.network){ break; } q.shift(); qSet(q); } } // 서버가 거절한 요청은 버림
    q.forEach(applyLocal);
  }
  async function queueOp(op, okMsg){
    if(H.preview){ toast('미리보기에서는 저장되지 않아요'); return; }
    applyLocal(op); render();
    try{ await flushQueue(); const nv = await H.onOp(op); if(nv){ view = nv; qGet().forEach(applyLocal); } if(okMsg) toast(okMsg); }
    catch(err){
      if(err && err.network){ const q=qGet(); q.push(op); qSet(q); toast('인터넷이 불안정해 이 기기에 저장했어요. 연결되면 자동으로 보내요'); }
      else if(op.type!=='report'){ toast((err && err.message) || '저장하지 못했어요'); try{ const nv = await H.onRefresh(); if(nv) view = nv; }catch(_){} }
    }
    render();
  }

  async function runOp(op, okMsg){
    if(busy) return;
    if(H.preview){ toast('미리보기에서는 변경되지 않아요'); return; }
    busy=true; render();
    try{
      const nv = await H.onOp(op);
      if(nv) view = nv;
      if(okMsg) toast(okMsg);
    }catch(err){ toast(err.message || '처리하지 못했어요. 잠시 후 다시 시도해주세요'); }
    finally{ busy=false; render(); }
  }

  async function onClick(ev){
    const el = ev.target.closest('[data-pp]'); if(!el) return;
    const act=el.dataset.pp, v=el.dataset.v, rid=el.dataset.rid;
    if(act==='tab'){ tab=v; selDay=null; sheet=null; render(); window.scrollTo(0,0); return; }
    if(act==='wsel'){ workRid=rid; render(); return; }
    if(act==='wdone'){
      const {ev} = workEvent(); if(!ev) return;
      const st = wf().find(x=>x.id===v); if(!st) return;
      if(st.checkin && !ev.checkinAt) await queueOp({type:'checkin', recordId:ev.recordId});
      const last = wf()[wf().length-1] && wf()[wf().length-1].id===v;
      await queueOp({type:'check', recordId:ev.recordId, itemId:'w:'+v, value:true}, last? '오늘도 수고 많으셨어요! 🎉' : null);
      const cur = document.querySelector('.pw-cur'); if(cur) cur.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    if(act==='wtoggle'){
      const {ev} = workEvent(); if(!ev) return;
      const st = wf().find(x=>x.id===v); if(!st) return;
      const done = stepDone(ev, st);
      if(done && !confirm(`"${st.title}" 완료를 취소할까요?`)) return;
      await queueOp({type:'check', recordId:ev.recordId, itemId:'w:'+v, value:!done});
      return;
    }
    if(act==='reports'){ const {ev}=workEvent(); sheet = {mode:'reports', rid: ev? ev.recordId : null}; render(); return; }
    if(act==='compose'){ openCompose(v); return; }
    if(act==='sheetClose'){ sheet=null; render(); return; }
    if(act==='copyMsg' || act==='sendKakao'){
      const ta = document.getElementById('pwMsg'); const text = ta ? ta.value : (sheet && sheet.text) || '';
      if(sheet) sheet.text = text;
      const m = msgById(sheet && sheet.mid); const x = eventById(sheet && sheet.rid);
      if(act==='copyMsg'){ if(await copyText(text)) toast('복사했어요. 원하는 곳에 붙여넣어 보내주세요'); return; }
      if(act==='sendKakao'){ // 모먼트웍스 공식 카카오톡 채널 채팅으로 보고 (내용은 복사 후 붙여넣기)
        const w = window.open(kakaoUrl(), '_blank');
        const copied = await copyText(text);
        toast(copied ? '보고 내용을 복사했어요. 카톡 채팅창에 붙여넣어 보내주세요' : '카톡 채팅창이 열려요. 내용을 입력해 보내주세요');
        if(m && x) logReport(x.recordId, m, text);
        if(!w) setTimeout(()=>{ location.href = kakaoUrl(); }, 600);
        return;
      }
    }
    if(act==='refresh'){
      if(busy) return; busy=true; render();
      try{ await flushQueue(); const nv = await H.onRefresh(); if(nv){ view=nv; qGet().forEach(applyLocal); } toast('최신 정보로 업데이트했어요'); }
      catch(err){ toast(err.message||'불러오지 못했어요'); }
      finally{ busy=false; render(); }
      return;
    }
    if(act==='logout'){ if(H.onLogout) H.onLogout(); return; }
    if(act==='closePreview'){ if(H.onClosePreview) H.onClosePreview(); return; }
    if(act==='confirm'){ runOp({type:'confirm', recordId:rid, value:true}, '배정 확인이 대표에게 전달됐어요'); return; }
    if(act==='checkin'){ queueOp({type:'checkin', recordId:rid}, '도착 체크인 완료! 오늘도 잘 부탁드려요'); return; }
    if(act==='prep' || act==='sel'){ selRecord=rid; tab='prep'; render(); if(act==='prep') window.scrollTo(0,0); return; }
    if(act==='map'){ const x=eventById(rid); if(x) openMap(x); return; }
    if(act==='ics'){ const x=eventById(rid); if(x) downloadIcs([x], 'momentworks-'+x.date+'.ics'); return; }
    if(act==='icsAll'){ downloadIcs(upcoming(), 'momentworks-schedule.ics'); return; }
    if(act==='cal'){ calCursor=shiftMonth(calCursor, Number(v)); render(); return; }
    if(act==='acal'){ availCursor=shiftMonth(availCursor, Number(v)); render(); return; }
    if(act==='day'){ selDay = (selDay===v)? null : v; render(); return; }
    if(act==='avail'){
      if(el.dataset.locked){ toast('이 날짜는 대표에게 직접 연락해주세요'); return; }
      const cur=(view.availability||{})[v];
      const order=[null,'off','am','pm'];
      const next=order[(order.indexOf(cur?cur.type:null)+1)%order.length];
      runOp({type:'availability', date:v, value:next}, next? '휴무 정보가 공유됐어요' : '휴무를 해제했어요');
      return;
    }
  }
  function onInput(ev){
    if(!sheet) return;
    if(ev.target.id==='pwMsg') sheet.text = ev.target.value;
    if(ev.target.id==='pwTicketPhone') sheet.ticket = ev.target.value;
  }
  function onChange(ev){
    const cb = ev.target.closest('[data-ppcheck]');
    if(cb){ runOp({type:'check', recordId:selRecord, itemId:cb.dataset.ppcheck, value:cb.checked}); return; }
    const sel = ev.target.closest('[data-ppsel]');
    if(sel && sel.dataset.ppsel==='payMonth'){ payMonth=sel.value; render(); }
  }

  function mount(el, v, handlers){
    unmount();
    root=el; view=v; H=handlers||{}; tab='home'; workRid=null; sheet=null;
    qGet().forEach(applyLocal);
    clearInterval(mount._t); mount._t = setInterval(()=>{ if(root && qGet().length) flushQueue().then(()=> render()); }, 30000); selRecord=null; calCursor=null; availCursor=null; payMonth=null; selDay=null; busy=false;
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    render();
  }
  function update(v){ view=v; qGet().forEach(applyLocal); if(!(sheet && document.activeElement && document.activeElement.id==='pwMsg')) render(); }
  function unmount(){ if(root){ root.removeEventListener('click', onClick); root.removeEventListener('change', onChange); root.removeEventListener('input', onInput); root.innerHTML=''; } root=null; view=null; }
  return {mount, update, unmount, toast, buildIcs};
})();

</script>
<script>
/* =========================================================
   모먼트웍스 파트너스오피스 (통합관리시스템과 분리 운영되는 파트너 전용 페이지)
   - 서버: 통합관리시스템과 같은 구글 Apps Script 웹 앱(v2)
   - 이 페이지는 파트너 전용 API(partnerView / partnerUpdate)만 사용하므로
     계약 전체·금액 정보에는 접근하지 않습니다.
   - 서버 주소는 통합관리시스템과 같은 웹 앱 주소가 기본으로 들어 있어서
     파트너는 접속코드만 입력하면 바로 접속돼요.
     (초대 링크의 #api=... 나 "서버 주소 변경"으로 다른 주소를 쓸 수도 있어요)
========================================================= */
const OFFICE_API_URL = 'https://script.google.com/macros/s/AKfycby5hXIA_hj4wLSKUyrigg_f6H3U8IGfJ9j-6To-Wzhb8WU0RB0H8LLd8_CkziE9GYlY/exec';
const LS_API = 'mwpo_api', LS_CODE = 'mwpo_code';

const app = document.getElementById('app');
let API = '', CODE = '', lastLoad = 0;

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normCode(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

function readHash(){
  const h = location.hash.replace(/^#/,''); if(!h) return {};
  const out = {}; h.split('&').forEach(p=>{ const i=p.indexOf('='); if(i>0) out[decodeURIComponent(p.slice(0,i))] = decodeURIComponent(p.slice(i+1)); });
  return out;
}
function apiUrl(params){ const u = new URL(API); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); return u.toString(); }

async function fetchView(code){
  try{ return await fetchViewOnce(code); }
  catch(ex){
    if(OFFICE_API_URL && API !== OFFICE_API_URL && ex.network){ API = OFFICE_API_URL; ls(LS_API, null); return await fetchViewOnce(code); }
    throw ex;
  }
}
async function fetchViewOnce(code){
  let res;
  try{ res = await fetch(apiUrl({action:'partnerView', code}), {method:'GET'}); }
  catch(e){ const er = new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해주세요'); er.network = true; throw er; }
  let j; try{ j = await res.json(); }catch(e){ const er = new Error('서버 응답을 읽지 못했어요. 잠시 후 다시 시도해주세요'); er.network = true; throw er; }
  if(Array.isArray(j)) throw new Error('서버 스크립트가 아직 v6로 업데이트되지 않았어요. 대표에게 알려주세요');
  if(!j || !j.ok) throw new Error((j && j.error) || '정보를 불러오지 못했어요');
  lastLoad = Date.now();
  return j;
}
async function postOp(op){
  let res;
  try{ res = await fetch(apiUrl({action:'partnerUpdate'}), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({code: CODE, op})}); }
  catch(e){ const er = new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요'); er.network = true; throw er; }
  let j; try{ j = await res.json(); }catch(e){ const er = new Error('서버 응답을 읽지 못했어요'); er.network = true; throw er; }
  if(!j || !j.ok) throw new Error((j && j.error) || '저장하지 못했어요');
  lastLoad = Date.now();
  return j.view;
}

function entryShell(label, inner){
  return `<div class="mw-entry"><div class="mw-entry-inner">
    <img class="mw-entry-logo" src="${MW_LOGO_FULL}" alt="Moment Works · Managing Meaningful Moments">
    <p class="mw-entry-label">${esc(label)}</p>
    ${inner}
    <p class="mw-foot">© MOMENT WORKS</p>
  </div></div>`;
}
function screenSetup(msg){
  PartnerPortal.unmount();
  app.innerHTML = entryShell('서버 연결', `<form id="setupForm">
    <p class="mw-note">대표에게 받은 초대 링크로 접속하면 자동으로 설정돼요.<br>직접 입력하려면 서버(웹 앱) 주소를 붙여넣어주세요.</p>
    <div class="mw-field"><label for="apiInput">서버 주소</label><input id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API)}"></div>
    <div class="mw-error" id="setupErr">${esc(msg||'')}</div>
    <button class="mw-btn" type="submit">저장하기</button>
    ${API?'<button class="mw-link" type="button" id="backBtn">로그인으로 돌아가기</button>':''}
  </form>`);
  document.getElementById('setupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const v = document.getElementById('apiInput').value.trim();
    const err = document.getElementById('setupErr');
    if(!/^https:\/\//.test(v)){ err.textContent='https:// 로 시작하는 주소를 입력해주세요'; return; }
    try{
      const res = await fetch(v + (v.includes('?')?'&':'?') + 'action=ping');
      const j = await res.json();
      if(Array.isArray(j) || !j || Number(j.version)<2) throw new Error('서버 스크립트가 최신이 아니에요. 통합관리시스템의 "분리 운영·설정"에서 스크립트를 업데이트해주세요');
    }catch(ex){ err.textContent = ex.message && ex.message.includes('v2') ? ex.message : '서버에 연결하지 못했어요. 주소를 확인해주세요'; return; }
    API = v; ls(LS_API, v === OFFICE_API_URL ? null : v); screenLogin();
  });
  const back = document.getElementById('backBtn'); if(back) back.addEventListener('click', ()=>screenLogin());
}

function screenLogin(msg, prefill){
  PartnerPortal.unmount();
  const saved = ls(LS_CODE) || '';
  app.innerHTML = entryShell('파트너스오피스', `<form id="loginForm">
    <p class="mw-note">전용 접속코드를 입력하면<br>내 예식 일정 · 출근시간 · 준비사항 등을 확인할 수 있어요 :)</p>
    <div class="mw-field"><label for="codeInput">접속코드</label><input class="code" id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-1234" value="${esc(prefill||saved)}"></div>
    <label class="mw-check"><input type="checkbox" id="rememberInput" checked> 이 기기에서 자동 로그인</label>
    <div class="mw-error" id="loginErr">${esc(msg||'')}</div>
    <button class="mw-btn" type="submit" id="loginBtn">내 일정 보기</button>
    <button class="mw-link" type="button" id="setupBtn" style="${OFFICE_API_URL?'opacity:.55;font-size:11px;':''}">${OFFICE_API_URL?'접속이 안 되면: 서버 주소 변경':'서버 주소 설정'}</button>
  </form>`);
  const sb = document.getElementById('setupBtn'); if(sb) sb.addEventListener('click', ()=>screenSetup());
  // 접속코드 입력 도우미: 대문자 · 4자리마다 하이픈
  const ci = document.getElementById('codeInput');
  ci.addEventListener('input', ()=>{ const raw = normCode(ci.value).slice(0, 12); const v = raw.replace(/(.{4})(?=.)/g, '$1-'); if(v !== ci.value) ci.value = v; });
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const code = document.getElementById('codeInput').value.trim();
    const err = document.getElementById('loginErr'), btn = document.getElementById('loginBtn');
    if(!normCode(code)){ err.textContent='접속코드를 입력해주세요'; return; }
    btn.disabled = true; btn.textContent = '확인 중…'; err.textContent='';
    try{
      const view = await fetchView(code);
      CODE = code;
      ls(LS_CODE, document.getElementById('rememberInput').checked ? code : null);
      openPortal(view);
    }catch(ex){ err.textContent = ex.message; btn.disabled=false; btn.textContent='내 일정 보기'; }
  });
  if(!prefill && !saved) setTimeout(()=>document.getElementById('codeInput').focus(), 50);
}

function openPortal(view){
  app.innerHTML = '<div id="portalRoot"></div>';
  PartnerPortal.mount(document.getElementById('portalRoot'), view, {
    onRefresh: ()=> fetchView(CODE),
    onOp: (op)=> postOp(op),
    onLogout: ()=>{ if(confirm('로그아웃할까요? 자동 로그인도 해제돼요.')){ ls(LS_CODE, null); CODE=''; screenLogin(); } }
  });
}

/* 다른 앱을 보다가 돌아오면 5분마다 자동 새로고침 */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState!=='visible' || !CODE || Date.now()-lastLoad < 5*60*1000) return;
  try{ const v = await fetchView(CODE); PartnerPortal.update(v); }catch(e){ /* 조용히 무시 */ }
});

(async function boot(){
  const h = readHash();
  if(h.api && /^https:\/\//.test(h.api)) ls(LS_API, h.api === OFFICE_API_URL ? null : h.api);
  if(location.hash) history.replaceState(null, '', location.pathname + location.search); // 코드가 주소창에 남지 않도록
  API = ls(LS_API) || OFFICE_API_URL || '';   // 초대 링크로 받은 주소 → 기본 주소 순서
  if(!API){ screenSetup(); return; }
  const code = h.code || ls(LS_CODE);
  if(code){
    app.innerHTML = entryShell('파트너스오피스', '<p class="mw-loading">일정을 불러오는 중</p>');
    try{ const view = await fetchView(code); CODE = code; if(h.code) ls(LS_CODE, code); openPortal(view); return; }
    catch(ex){ screenLogin(ex.message, h.code||''); return; }
  }
  screenLogin();
})();
</script>
